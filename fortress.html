<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortress v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            overflow: hidden;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
        }
        #gameCanvas {
            display: block;
        }
        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #ui div { margin: 8px 0; }
        .val { color: #0f0; font-weight: bold; }
        #turnIndicator {
            background: linear-gradient(135deg, #4CAF50, #388E3C);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: background 0.3s, transform 0.2s;
        }
        #turnIndicator.p2turn {
            background: linear-gradient(135deg, #2196F3, #1976D2);
        }
        #turnIndicator.aiturn {
            background: linear-gradient(135deg, #FF5722, #E64A19);
        }
        #turnIndicator.thinking {
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #status {
            position: fixed;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 10px;
        }
        #score {
            position: fixed;
            top: 80px;
            right: 20px;
            color: #FFD700;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
        }
        #windUI {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #windUI.show { opacity: 1; }

        #message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
            pointer-events: none;
            opacity: 0;
        }
        #message.show {
            opacity: 1;
            animation: popIn 0.5s ease-out;
        }
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        #startBtn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 50px;
            font-size: 24px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }

        #restartBtn {
            position: fixed;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 50px;
            font-size: 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            display: none;
            z-index: 100;
        }
        #restartBtn:hover {
            background: #0056b3;
        }

        #gameOverScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 99;
        }
        #gameOverScreen h1 {
            color: white;
            font-size: 64px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255,0,0,0.8);
        }
        #gameOverScreen .winner {
            color: #FFD700;
            font-size: 36px;
            margin-bottom: 30px;
        }

        #modeSelect {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
        }
        #modeSelect h2 {
            color: white;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .modeBtn {
            display: block;
            width: 200px;
            padding: 15px;
            margin: 10px auto;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
        }
        #mode1P { background: #4CAF50; }
        #mode2P { background: #2196F3; }
        .modeBtn:hover { opacity: 0.9; }

        #readyStatus {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
        }
        #readyStatus h3 {
            color: white;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .playerStatus {
            color: white;
            font-size: 20px;
            margin: 10px 0;
            padding: 10px 20px;
            border-radius: 8px;
        }
        .playerStatus.ready { background: #28a745; }
        .playerStatus.waiting { background: #666; }
        #waitingText {
            color: #aaa;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div id="turnIndicator">P1 차례</div>
        <div>각도: <span class="val" id="angleVal">45°</span></div>
        <div>파워: <span class="val" id="powerVal">50%</span></div>
        <div>바람: <span class="val" id="windVal">→ 0</span></div>
        <div>지형: <span class="val" id="terrainVal">-</span></div>
    </div>

    <div id="status">컨트롤러 대기중...</div>
    <div id="score">SCORE: 0</div>
    <div id="message"></div>

    <button id="startBtn" style="display:none;">게임 시작 (마우스 테스트)</button>

    <div id="gameOverScreen">
        <h1 id="gameOverTitle">GAME OVER</h1>
        <div class="winner" id="winnerText"></div>
        <button id="restartBtn">다시 시작</button>
    </div>

    <div id="modeSelect">
        <h2>게임 모드 선택</h2>
        <button class="modeBtn" id="mode1P">1P vs AI</button>
        <button class="modeBtn" id="mode2P">2P 대전</button>
    </div>

    <div id="readyStatus">
        <h3 id="modeTitle">2P 대전</h3>
        <div class="playerStatus waiting" id="p1Status">P1: 대기중...</div>
        <div class="playerStatus waiting" id="p2Status">P2: 대기중...</div>
        <div id="waitingText">플레이어가 폰에서 "준비!" 버튼을 누르면 게임이 시작됩니다</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const turnIndicator = document.getElementById('turnIndicator');
        const terrainVal = document.getElementById('terrainVal');
        const angleVal = document.getElementById('angleVal');
        const powerVal = document.getElementById('powerVal');
        const windVal = document.getElementById('windVal');
        const statusDiv = document.getElementById('status');
        const scoreDiv = document.getElementById('score');
        const messageDiv = document.getElementById('message');
        const startBtn = document.getElementById('startBtn');
        const modeSelect = document.getElementById('modeSelect');
        const readyStatus = document.getElementById('readyStatus');
        const modeTitle = document.getElementById('modeTitle');
        const p1Status = document.getElementById('p1Status');
        const p2Status = document.getElementById('p2Status');
        const waitingText = document.getElementById('waitingText');
        const mode1PBtn = document.getElementById('mode1P');
        const mode2PBtn = document.getElementById('mode2P');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const gameOverTitle = document.getElementById('gameOverTitle');
        const winnerText = document.getElementById('winnerText');
        const restartBtn = document.getElementById('restartBtn');

        // 캔버스 크기
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let ws = null;
        let gameActive = false;
        let score = 0;

        // 게임 모드
        let gameMode = 0;  // 0: 미선택, 1: 1P, 2: 2P

        // 게임 상태
        let angle = 45;
        let power = 50;
        let wind = 0;
        let currentTurn = 1;  // 1 또는 2
        let player1Connected = false;
        let player2Connected = false;
        let player1Ready = false;
        let player2Ready = false;

        // AI 관련
        let aiThinking = false;
        let aiLevel = 1;  // AI 레벨 (라운드마다 증가)
        const AI_BASE_ACCURACY = 0.5;  // 기본 정확도 50%
        const AI_MAX_ACCURACY = 0.85;  // 최대 정확도 85% (절대 100%는 안됨)

        // 플레이어 탱크들
        const players = {
            1: {
                x: 150,
                y: 0,
                width: 60,
                height: 30,
                color: '#4CAF50',
                hp: 3,
                angle: 45,
                power: 50
            },
            2: {
                x: canvas.width - 210,
                y: 0,
                width: 60,
                height: 30,
                color: '#2196F3',
                hp: 3,
                angle: 45,
                power: 50,
                facingLeft: true
            }
        };

        // 포탄
        let projectile = null;

        // 폭발 효과
        let explosions = [];

        // 탱크 파편 효과
        let tankDebris = [];

        // 장애물 (바위/벽)
        let obstacles = [];

        // 바람 파티클
        let windParticles = [];
        const MAX_WIND_PARTICLES = 50;

        // 배경 요소들
        let clouds = [];
        let mountains = [];
        let trees = [];
        let sunAngle = 0;

        // 머즐 플래시
        let muzzleFlash = null;

        // 연기 파티클
        let smokeParticles = [];

        // 배경 초기화
        function initBackground() {
            // 구름 생성
            clouds = [];
            for (let i = 0; i < 8; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: 30 + Math.random() * 120,
                    width: 80 + Math.random() * 120,
                    height: 30 + Math.random() * 30,
                    speed: 0.2 + Math.random() * 0.3,
                    opacity: 0.6 + Math.random() * 0.3
                });
            }

            // 산 생성 (뒤쪽 레이어)
            mountains = [];
            // 먼 산 (흐릿한)
            for (let i = 0; i < 5; i++) {
                mountains.push({
                    x: i * (canvas.width / 4) - 50 + Math.random() * 100,
                    height: 150 + Math.random() * 100,
                    width: 200 + Math.random() * 150,
                    layer: 0,
                    color: '#6B8E9F'
                });
            }
            // 가까운 산 (진한)
            for (let i = 0; i < 4; i++) {
                mountains.push({
                    x: i * (canvas.width / 3) + Math.random() * 100,
                    height: 100 + Math.random() * 80,
                    width: 180 + Math.random() * 120,
                    layer: 1,
                    color: '#5A7D8C'
                });
            }

            // 나무 생성
            trees = [];
            for (let i = 0; i < 15; i++) {
                const x = Math.random() * canvas.width;
                trees.push({
                    x: x,
                    size: 15 + Math.random() * 25,
                    type: Math.random() > 0.5 ? 'pine' : 'round'
                });
            }
        }

        // 구름 그리기
        function drawCloud(cloud) {
            ctx.fillStyle = `rgba(255, 255, 255, ${cloud.opacity})`;
            // 여러 원으로 구름 모양
            const cx = cloud.x;
            const cy = cloud.y;
            ctx.beginPath();
            ctx.arc(cx, cy, cloud.height * 0.8, 0, Math.PI * 2);
            ctx.arc(cx - cloud.width * 0.25, cy + 5, cloud.height * 0.6, 0, Math.PI * 2);
            ctx.arc(cx + cloud.width * 0.25, cy + 5, cloud.height * 0.7, 0, Math.PI * 2);
            ctx.arc(cx - cloud.width * 0.4, cy + 10, cloud.height * 0.4, 0, Math.PI * 2);
            ctx.arc(cx + cloud.width * 0.4, cy + 8, cloud.height * 0.5, 0, Math.PI * 2);
            ctx.fill();
        }

        // 산 그리기
        function drawMountain(m) {
            const baseY = canvas.height - 200;
            ctx.fillStyle = m.color;
            ctx.beginPath();
            ctx.moveTo(m.x - m.width / 2, baseY);
            ctx.lineTo(m.x, baseY - m.height);
            ctx.lineTo(m.x + m.width / 2, baseY);
            ctx.closePath();
            ctx.fill();

            // 눈 덮인 봉우리
            if (m.height > 120) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.moveTo(m.x - m.width * 0.1, baseY - m.height + 30);
                ctx.lineTo(m.x, baseY - m.height);
                ctx.lineTo(m.x + m.width * 0.1, baseY - m.height + 30);
                ctx.closePath();
                ctx.fill();
            }
        }

        // 태양 그리기
        function drawSun() {
            const sunX = canvas.width - 120;
            const sunY = 100;
            const radius = 40;

            // 태양 광선
            ctx.save();
            ctx.translate(sunX, sunY);
            ctx.rotate(sunAngle);

            for (let i = 0; i < 12; i++) {
                ctx.fillStyle = 'rgba(255, 200, 50, 0.3)';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-15, -radius - 30);
                ctx.lineTo(15, -radius - 30);
                ctx.closePath();
                ctx.fill();
                ctx.rotate(Math.PI / 6);
            }
            ctx.restore();

            // 태양 본체
            const sunGradient = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, radius);
            sunGradient.addColorStop(0, '#FFF5B8');
            sunGradient.addColorStop(0.5, '#FFD93D');
            sunGradient.addColorStop(1, '#FF8C00');
            ctx.fillStyle = sunGradient;
            ctx.beginPath();
            ctx.arc(sunX, sunY, radius, 0, Math.PI * 2);
            ctx.fill();

            sunAngle += 0.005;
        }

        // 나무 그리기
        function drawTree(tree, groundY) {
            const x = tree.x;
            const y = groundY;
            const size = tree.size;

            // 줄기
            ctx.fillStyle = '#5D4037';
            ctx.fillRect(x - size * 0.1, y - size * 0.5, size * 0.2, size * 0.5);

            if (tree.type === 'pine') {
                // 소나무
                ctx.fillStyle = '#2E7D32';
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(x, y - size * (0.5 + i * 0.4));
                    ctx.lineTo(x - size * (0.4 - i * 0.1), y - size * (0.3 + i * 0.3));
                    ctx.lineTo(x + size * (0.4 - i * 0.1), y - size * (0.3 + i * 0.3));
                    ctx.closePath();
                    ctx.fill();
                }
            } else {
                // 둥근 나무
                ctx.fillStyle = '#388E3C';
                ctx.beginPath();
                ctx.arc(x, y - size * 0.8, size * 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#2E7D32';
                ctx.beginPath();
                ctx.arc(x - size * 0.2, y - size * 0.9, size * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 바람 파티클 생성
        function spawnWindParticle() {
            if (Math.abs(wind) < 0.5) return;  // 바람 약하면 파티클 없음

            const speed = Math.abs(wind);
            // 바람 세기에 따라 파티클 생성 확률 조절
            if (Math.random() > speed / 10) return;

            const fromLeft = wind > 0;
            windParticles.push({
                x: fromLeft ? -20 : canvas.width + 20,
                y: Math.random() * (canvas.height * 0.7),  // 상단 70%에서만
                size: 2 + Math.random() * 3,
                speed: speed * (0.8 + Math.random() * 0.4),
                alpha: 0.3 + Math.random() * 0.4,
                type: Math.random() > 0.7 ? 'leaf' : 'dust'  // 나뭇잎 or 먼지
            });
        }

        // 바람 파티클 업데이트
        function updateWindParticles() {
            // 새 파티클 생성
            for (let i = 0; i < 3; i++) {
                if (windParticles.length < MAX_WIND_PARTICLES) {
                    spawnWindParticle();
                }
            }

            // 파티클 업데이트
            for (let i = windParticles.length - 1; i >= 0; i--) {
                const p = windParticles[i];
                const dir = wind > 0 ? 1 : -1;

                p.x += p.speed * 3 * dir;
                p.y += Math.sin(p.x * 0.02) * 0.5;  // 약간의 흔들림

                // 나뭇잎은 회전
                if (p.type === 'leaf') {
                    p.rotation = (p.rotation || 0) + 0.1 * dir;
                }

                // 화면 밖으로 나가면 제거
                if ((wind > 0 && p.x > canvas.width + 30) ||
                    (wind < 0 && p.x < -30)) {
                    windParticles.splice(i, 1);
                }
            }
        }

        // 지형 데이터 (높낮이 있는 지형)
        const terrainPoints = [];
        const terrainSegments = 100;  // 지형 세그먼트 수
        let currentTerrainType = '';

        // 지형 타입 목록
        const terrainTypes = [
            'hills',      // 완만한 언덕
            'valley',     // 가운데가 낮은 계곡
            'mountain',   // 가운데 높은 산
            'plateau',    // 평평한 고원
            'canyon',     // 깊은 협곡
            'stairs',     // 계단식 지형
            'dunes',      // 사막 모래언덕
            'cliffs'      // 절벽 지형
        ];

        // 지형 타입 한글 이름
        const terrainNames = {
            'hills': '언덕',
            'valley': '계곡',
            'mountain': '산악',
            'plateau': '고원',
            'canyon': '협곡',
            'stairs': '계단',
            'dunes': '사막',
            'cliffs': '절벽'
        };

        function generateTerrain() {
            terrainPoints.length = 0;
            const baseY = canvas.height - 150;

            // 랜덤 지형 타입 선택
            currentTerrainType = terrainTypes[Math.floor(Math.random() * terrainTypes.length)];
            terrainVal.textContent = terrainNames[currentTerrainType];
            console.log('지형 타입:', currentTerrainType);

            for (let i = 0; i <= terrainSegments; i++) {
                const x = (canvas.width / terrainSegments) * i;
                const normalizedX = i / terrainSegments;
                let y = baseY;

                switch (currentTerrainType) {
                    case 'hills':
                        // 완만한 언덕들
                        y += Math.sin(normalizedX * Math.PI * 2.5) * 60;
                        y += Math.sin(normalizedX * Math.PI * 5) * 25;
                        y += Math.sin(normalizedX * Math.PI * 1.2) * 40;
                        break;

                    case 'valley':
                        // 가운데가 낮은 계곡
                        const valleyDepth = Math.sin(normalizedX * Math.PI) * 100;
                        y += valleyDepth;
                        y += Math.sin(normalizedX * Math.PI * 4) * 20;
                        break;

                    case 'mountain':
                        // 가운데 높은 산
                        const peak = -Math.sin(normalizedX * Math.PI) * 120;
                        y += peak;
                        y += Math.sin(normalizedX * Math.PI * 6) * 15;
                        // 산 양쪽에 작은 언덕
                        if (normalizedX < 0.3 || normalizedX > 0.7) {
                            y += Math.sin(normalizedX * Math.PI * 3) * 30;
                        }
                        break;

                    case 'plateau':
                        // 평평한 고원 (가운데가 평평하고 양쪽이 낮음)
                        if (normalizedX < 0.25) {
                            y += normalizedX * 4 * 60;  // 왼쪽 경사
                        } else if (normalizedX > 0.75) {
                            y += (1 - normalizedX) * 4 * 60;  // 오른쪽 경사
                        } else {
                            y -= 60;  // 평평한 고원
                        }
                        y += Math.sin(normalizedX * Math.PI * 8) * 10;
                        break;

                    case 'canyon':
                        // 깊은 협곡
                        const canyonPos = Math.abs(normalizedX - 0.5) * 2;
                        y += Math.pow(canyonPos, 0.5) * 80 - 40;
                        y += Math.sin(normalizedX * Math.PI * 6) * 15;
                        break;

                    case 'stairs':
                        // 계단식 지형
                        const steps = 5;
                        const stepIndex = Math.floor(normalizedX * steps);
                        const stepHeight = (stepIndex % 2 === 0) ? -30 : 30;
                        y += stepHeight + (stepIndex - steps/2) * 15;
                        y += Math.sin(normalizedX * Math.PI * 10) * 8;
                        break;

                    case 'dunes':
                        // 사막 모래언덕 (부드러운 곡선)
                        y += Math.sin(normalizedX * Math.PI * 1.5) * 50;
                        y += Math.sin(normalizedX * Math.PI * 3.5 + 1) * 35;
                        y += Math.sin(normalizedX * Math.PI * 7) * 15;
                        break;

                    case 'cliffs':
                        // 절벽 지형 (급격한 높이 변화)
                        if (normalizedX < 0.35) {
                            y -= 50;  // 왼쪽 높은 지대
                        } else if (normalizedX < 0.4) {
                            y -= 50 + (normalizedX - 0.35) * 20 * 100;  // 급경사
                        } else if (normalizedX < 0.6) {
                            y += 50;  // 낮은 지대
                        } else if (normalizedX < 0.65) {
                            y += 50 - (normalizedX - 0.6) * 20 * 100;  // 급경사
                        } else {
                            y -= 50;  // 오른쪽 높은 지대
                        }
                        y += Math.sin(normalizedX * Math.PI * 8) * 12;
                        break;
                }

                // 양 끝은 약간 평평하게 (탱크 배치 위해)
                if (i < 8 || i > terrainSegments - 8) {
                    const edge = i < 8 ? i : terrainSegments - i;
                    const factor = edge / 8;
                    y = baseY + (y - baseY) * factor;
                }

                terrainPoints.push({ x, y });
            }
        }

        // x 좌표에서 지형 높이 가져오기
        function getTerrainY(x) {
            if (x <= 0) return terrainPoints[0].y;
            if (x >= canvas.width) return terrainPoints[terrainPoints.length - 1].y;

            // 해당 x에 가장 가까운 두 점 찾기
            const segmentWidth = canvas.width / terrainSegments;
            const index = Math.floor(x / segmentWidth);
            const nextIndex = Math.min(index + 1, terrainPoints.length - 1);

            // 선형 보간
            const p1 = terrainPoints[index];
            const p2 = terrainPoints[nextIndex];
            const t = (x - p1.x) / (p2.x - p1.x || 1);

            return p1.y + (p2.y - p1.y) * t;
        }

        // 탱크 위치에서 지형 기울기 계산 (라디안)
        function getTerrainAngle(x, width) {
            const leftY = getTerrainY(x);
            const rightY = getTerrainY(x + width);
            const angle = Math.atan2(rightY - leftY, width);
            return angle;
        }

        // 탱크 위치 업데이트 (지형에 맞춤)
        function updateTankPosition(player) {
            const centerX = player.x + player.width / 2;
            const terrainY = getTerrainY(centerX);
            player.y = terrainY - player.height;
            player.terrainAngle = getTerrainAngle(player.x, player.width);
        }

        // 장애물 생성 함수
        function generateObstacles() {
            obstacles = [];
            const numObstacles = 2 + Math.floor(Math.random() * 3);  // 2~4개

            for (let i = 0; i < numObstacles; i++) {
                // 중앙 영역에 장애물 배치 (탱크 위치 피함)
                const minX = 250;
                const maxX = canvas.width - 300;
                const x = minX + Math.random() * (maxX - minX);
                const terrainY = getTerrainY(x);

                const type = Math.random() > 0.5 ? 'rock' : 'wall';

                if (type === 'rock') {
                    obstacles.push({
                        type: 'rock',
                        x: x,
                        y: terrainY,
                        width: 40 + Math.random() * 40,
                        height: 30 + Math.random() * 30
                    });
                } else {
                    obstacles.push({
                        type: 'wall',
                        x: x,
                        y: terrainY - 80 - Math.random() * 40,
                        width: 20 + Math.random() * 15,
                        height: 80 + Math.random() * 40
                    });
                }
            }
        }

        // 장애물 충돌 체크
        function checkObstacleCollision(px, py) {
            for (const obs of obstacles) {
                if (obs.type === 'rock') {
                    // 바위는 반원형으로 체크
                    const cx = obs.x;
                    const cy = obs.y;
                    const rx = obs.width / 2;
                    const ry = obs.height;
                    const dx = (px - cx) / rx;
                    const dy = (py - cy) / ry;
                    if (dx * dx + dy * dy < 1 && py > cy - ry) {
                        return true;
                    }
                } else {
                    // 벽은 사각형
                    if (px > obs.x && px < obs.x + obs.width &&
                        py > obs.y && py < obs.y + obs.height) {
                        return true;
                    }
                }
            }
            return false;
        }

        // 탱크 파편 생성
        function createTankDebris(x, y, color) {

        // 초기 지형 생성
        generateTerrain();

        updateTankPosition(players[1]);

        // 이전 groundY 호환성을 위한 참조값

        const GRAVITY = 0.3;

        // WebSocket
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${location.host}/ws`;

        function connect() {
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'fortress_game' }));
            };
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                console.log('WS 메시지 수신:', data);

                // 플레이어 연결
                if (data.type === 'player_joined') {
                    const pNum = parseInt(data.player);
                    console.log('player_joined 받음:', pNum);
                    if (pNum === 1) {
                        player1Connected = true;
                        updateStatus();
                        updateReadyDisplay();
                    } else if (pNum === 2) {
                        player2Connected = true;
                        updateStatus();
                        updateReadyDisplay();
                    }
                    // 게임 진행 중이면 현재 턴 정보 전송
                    if (gameActive && ws && ws.readyState === 1) {
                        ws.send(JSON.stringify({ type: 'turn_change', currentTurn: currentTurn }));
                    }
                }

                // 플레이어 준비
                if (data.type === 'player_ready') {
                    const pNum = parseInt(data.player);
                    console.log('player_ready 받음:', pNum, 'data:', data);
                    if (pNum === 1) {
                        player1Ready = true;
                        console.log('player1Ready = true 설정됨');
                    } else if (pNum === 2) {
                        player2Ready = true;
                        console.log('player2Ready = true 설정됨');
                    }
                    updateReadyDisplay();
                    checkAutoStart();
                }

                // 각도/파워 업데이트 (현재 턴인 플레이어만)
                if (data.type === 'angle' && parseInt(data.player) === currentTurn) {
                    players[currentTurn].angle = data.angle;
                    angleVal.textContent = data.angle + '°';
                }
                if (data.type === 'power' && parseInt(data.player) === currentTurn) {
                    players[currentTurn].power = data.power;
                    powerVal.textContent = data.power + '%';
                }

                // 발사
                if (data.type === 'fire_fortress') {
                    console.log('fire_fortress 받음:', data, 'currentTurn:', currentTurn, 'gameActive:', gameActive, 'projectile:', projectile);
                    if (parseInt(data.player) === currentTurn && gameActive && !projectile) {
                        fireProjectile(parseInt(data.player), data.angle, data.power);
                    }
                }

                // 이동
                if (data.type === 'move' && parseInt(data.player) === currentTurn && gameActive && !projectile) {
                    const player = players[currentTurn];
                    const moveSpeed = 10;
                    if (data.direction === 'left') {
                        player.x = Math.max(50, player.x - moveSpeed);
                    } else if (data.direction === 'right') {
                        player.x = Math.min(canvas.width - 50 - player.width, player.x + moveSpeed);
                    }
                    // 지형에 맞춰 탱크 위치 업데이트
                    updateTankPosition(player);
                }

                // 게임 상태 요청 응답
                if (data.type === 'request_state') {
                    if (ws && ws.readyState === 1) {
                        ws.send(JSON.stringify({
                            type: 'turn_change',
                            currentTurn: gameActive ? currentTurn : 0
                        }));
                    }
                }

                // 모바일에서 게임 모드 설정
                if (data.type === 'set_game_mode') {
                    const mode = parseInt(data.mode);
                    selectMode(mode);
                    console.log('모바일에서 게임 모드 설정:', mode);
                }

                // 모바일에서 게임 시작 요청
                if (data.type === 'start_game_request') {
                    const mode = parseInt(data.mode);
                    if (!gameActive) {

                    restartGame();
                    console.log('모바일에서 재시작 요청');
                }
            };
            ws.onclose = () => {
                statusDiv.textContent = '연결 끊김';
                statusDiv.style.background = '#dc3545';
                setTimeout(connect, 3000);
            };
        }

        // 타겟 생성

        // 발사
        function fireProjectile(playerNum, ang, pow) {
            const player = players[playerNum];
            if (!player) {
                console.error('Invalid player:', playerNum);
                return;
            }

            // 값 검증
            const angle = parseFloat(ang) || player.angle || 45;
            const power = parseFloat(pow) || player.power || 50;

            const radians = angle * Math.PI / 180;
            const speed = power * 0.3;

            // 발사 방향 (P1은 오른쪽, P2는 왼쪽)
            const direction = playerNum === 1 ? 1 : -1;

            // 포구 위치 계산
            const turretX = player.x + player.width / 2 + (playerNum === 1 ? 10 : -10);
            const turretY = player.y + player.height / 3;
            const muzzleX = turretX + Math.cos(radians * direction + (playerNum === 2 ? Math.PI : 0)) * 50;
            const muzzleY = turretY - Math.sin(radians) * 50;

            projectile = {
                x: muzzleX,
                y: muzzleY,
                vx: Math.cos(radians) * speed * direction,
                vy: -Math.sin(radians) * speed,
                radius: 8,
                owner: playerNum,
                trail: []  // 연기 꼬리용
            };

            // 머즐 플래시 효과

            playFireSound();

        // ============ 사운드 시스템 ============
        let audioCtx = null;
        let windOscillator = null;
        let windGain = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        // 대포 발사음 (클래식 대포 - 둔탁한 쾅! 소리)
        function playFireSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // 메인 붐 소리 (깊고 둔탁한 저주파)
                const osc1 = ctx.createOscillator();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(80, now);
                osc1.frequency.exponentialRampToValueAtTime(20, now + 0.4);

                const gain1 = ctx.createGain();
                gain1.gain.setValueAtTime(0.9, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

                // 중간 톤 (울림감)
                const osc2 = ctx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(120, now);
                osc2.frequency.exponentialRampToValueAtTime(40, now + 0.3);

                const gain2 = ctx.createGain();
                gain2.gain.setValueAtTime(0.5, now);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                // 화약 폭발 노이즈 (거친 느낌)
                const bufferSize = ctx.sampleRate * 0.4;
                const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const noiseData = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    // 초반에 강하고 서서히 감소
                    const envelope = Math.exp(-i / (bufferSize * 0.08));
                    noiseData[i] = (Math.random() * 2 - 1) * envelope;
                }

                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = noiseBuffer;

                // 로우패스 필터 (둔탁하게)
                const noiseFilter = ctx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.setValueAtTime(600, now);
                noiseFilter.frequency.exponentialRampToValueAtTime(150, now + 0.3);

                const noiseGain = ctx.createGain();
                noiseGain.gain.setValueAtTime(0.6, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                // 잔향 (메아리 효과)
                const osc3 = ctx.createOscillator();
                osc3.type = 'sine';
                osc3.frequency.setValueAtTime(60, now + 0.1);
                osc3.frequency.exponentialRampToValueAtTime(25, now + 0.6);

                const gain3 = ctx.createGain();
                gain3.gain.setValueAtTime(0, now);
                gain3.gain.setValueAtTime(0.3, now + 0.1);
                gain3.gain.exponentialRampToValueAtTime(0.01, now + 0.7);

                // 연결
                osc1.connect(gain1);
                gain1.connect(ctx.destination);

                osc2.connect(gain2);
                gain2.connect(ctx.destination);

                noiseSource.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(ctx.destination);

                osc3.connect(gain3);
                gain3.connect(ctx.destination);

                osc1.start(now);
                osc1.stop(now + 0.5);
                osc2.start(now);
                osc2.stop(now + 0.35);
                noiseSource.start(now);
                osc3.start(now);
                osc3.stop(now + 0.7);
            } catch(e) {}
        }

        // 디스토션 커브 생성
        function makeDistortionCurve(amount) {
            const samples = 44100;
            const curve = new Float32Array(samples);
            const deg = Math.PI / 180;
            for (let i = 0; i < samples; i++) {
                const x = (i * 2) / samples - 1;
                curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
            }
            return curve;
        }

        // 폭발 소리 (강력한 임팩트)
        function playExplosionSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // 메인 폭발 노이즈
                const bufferSize = ctx.sampleRate * 0.8;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const envelope = Math.exp(-i / (bufferSize * 0.15));
                    data[i] = (Math.random() * 2 - 1) * envelope;
                }

                const source = ctx.createBufferSource();
                source.buffer = buffer;

                // 로우패스 필터 (둔탁한 느낌)
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, now);
                filter.frequency.exponentialRampToValueAtTime(200, now + 0.5);

                // 저주파 붐
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.4);

                const oscGain = ctx.createGain();
                oscGain.gain.setValueAtTime(0.7, now);
                oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

                // 컴프레서 (펀치감)
                const compressor = ctx.createDynamicsCompressor();
                compressor.threshold.value = -20;
                compressor.knee.value = 10;
                compressor.ratio.value = 8;
                compressor.attack.value = 0.001;
                compressor.release.value = 0.1;

                const masterGain = ctx.createGain();
                masterGain.gain.value = 0.7;

                // 연결
                source.connect(filter);
                filter.connect(compressor);
                osc.connect(oscGain);
                oscGain.connect(compressor);
                compressor.connect(masterGain);
                masterGain.connect(ctx.destination);

                source.start(now);
                osc.start(now);
                osc.stop(now + 0.5);
            } catch(e) {}
        }

        // 탱크 피격음 (금속 충격)
        function playHitSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // 금속 충격음
                const osc1 = ctx.createOscillator();
                osc1.type = 'square';
                osc1.frequency.setValueAtTime(400, now);
                osc1.frequency.exponentialRampToValueAtTime(100, now + 0.1);

                const gain1 = ctx.createGain();
                gain1.gain.setValueAtTime(0.4, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                // 공명음
                const osc2 = ctx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(600, now);

                const gain2 = ctx.createGain();
                gain2.gain.setValueAtTime(0.2, now);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                // 노이즈 버스트
                const bufferSize = ctx.sampleRate * 0.1;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.02));
                }
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const noiseGain = ctx.createGain();
                noiseGain.gain.value = 0.3;

                const filter = ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 2000;

                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(ctx.destination);

                osc1.start(now);
                osc1.stop(now + 0.15);
                osc2.start(now);
                osc2.stop(now + 0.3);
                noise.start(now);
            } catch(e) {}
        }

        // 턴 변경 사운드
        function playTurnSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(550, now + 0.1);
                osc.frequency.setValueAtTime(660, now + 0.2);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.setValueAtTime(0.25, now + 0.1);
                gain.gain.setValueAtTime(0.2, now + 0.2);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            } catch(e) {}
        }

        // 승리 사운드
        function playVictorySound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // 팡파레 멜로디
                const notes = [523, 659, 784, 1047]; // C5, E5, G5, C6
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    osc.type = 'square';
                    osc.frequency.value = freq;

                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0, now + i * 0.15);
                    gain.gain.linearRampToValueAtTime(0.2, now + i * 0.15 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.3);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.15);
                    osc.stop(now + i * 0.15 + 0.35);
                });
            } catch(e) {}
        }

        // 패배 사운드
        function playDefeatSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // 하강 멜로디
                const notes = [400, 350, 300, 200];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    osc.type = 'sawtooth';
                    osc.frequency.value = freq;

                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0, now + i * 0.2);
                    gain.gain.linearRampToValueAtTime(0.15, now + i * 0.2 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.2 + 0.3);

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 800;

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.2);
