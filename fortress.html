        // 게임 시작 사운드
        function playGameStartSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // 시작 드럼롤 느낌
                for (let i = 0; i < 6; i++) {
                    const osc = ctx.createOscillator();
                    osc.type = 'square';
                    osc.frequency.value = 200 + i * 50;

                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0, now + i * 0.08);
                    gain.gain.linearRampToValueAtTime(0.15 + i * 0.03, now + i * 0.08 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.1);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.15);
                }
            } catch(e) {}
        }

        // 바람 소리 시작/업데이트
        function updateWindSound() {
            try {
                const ctx = getAudioContext();
                const absWind = Math.abs(wind);

                if (absWind < 1) {
                    // 바람 약하면 소리 끄기
                    if (windGain) {
                        windGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
                    }
                    return;
                }

                if (!windOscillator) {
                    // 바람 소리 생성
                    const bufferSize = ctx.sampleRate * 2;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }

                    windOscillator = ctx.createBufferSource();
                    windOscillator.buffer = buffer;
                    windOscillator.loop = true;

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 400;
                    filter.Q.value = 0.5;

                    windGain = ctx.createGain();
                    windGain.gain.value = 0;

                    windOscillator.connect(filter);
                    filter.connect(windGain);
                    windGain.connect(ctx.destination);
                    windOscillator.start();
                }

                // 바람 세기에 따라 볼륨 조절
                const targetVolume = Math.min(0.15, absWind * 0.02);
                windGain.gain.linearRampToValueAtTime(targetVolume, ctx.currentTime + 0.3);
            } catch(e) {}
        }

        // 포탄 휘파람 소리
        function playProjectileSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.linearRampToValueAtTime(400, now + 1.5);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.15, now + 0.5);
                gain.gain.linearRampToValueAtTime(0.01, now + 1.5);

                // 트레몰로 효과
                const lfo = ctx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 15;

                const lfoGain = ctx.createGain();
                lfoGain.gain.value = 0.03;

                lfo.connect(lfoGain);
                lfoGain.connect(gain.gain);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                lfo.start(now);
                osc.stop(now + 1.5);
                lfo.stop(now + 1.5);
            } catch(e) {}
        }

        // 폭발 생성
        function createExplosion(x, y) {
            explosions.push({
                x: x,
                y: y,
                radius: 5,
                maxRadius: 60,
                alpha: 1
            });
            playExplosionSound();
        }

        // 충돌 체크
        function checkCollision() {
            if (!projectile) return;

            // 지형 충돌 (높낮이 있는 지형)
            const terrainY = getTerrainY(projectile.x);
            if (projectile.y > terrainY) {
                createExplosion(projectile.x, terrainY);
                projectile = null;
                nextTurn();
                return;
            }

            // 장애물 충돌
            if (checkObstacleCollision(projectile.x, projectile.y)) {
                createExplosion(projectile.x, projectile.y);
                projectile = null;
                nextTurn();
                return;
            }

            // 화면 밖
            if (projectile.x < 0 || projectile.x > canvas.width || projectile.y < -500) {
                projectile = null;
                nextTurn();
                return;
            }

            // 상대 탱크 충돌 체크
            const enemyNum = projectile.owner === 1 ? 2 : 1;
            const enemy = players[enemyNum];

            if (projectile.x > enemy.x && projectile.x < enemy.x + enemy.width &&
                projectile.y > enemy.y && projectile.y < enemy.y + enemy.height) {

                createExplosion(projectile.x, projectile.y);

                // 탱크 피격 효과 (파편)
                createTankDebris(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color);
                playHitSound();  // 피격 사운드

                enemy.hp--;
                enemy.damaged = true;  // 피격 플래그
                setTimeout(() => { enemy.damaged = false; }, 300);

                projectile = null;

                showMessage(`P${enemyNum} HIT! (HP: ${enemy.hp})`);

                // 승패 판정
                if (enemy.hp <= 0) {
                    // 탱크 완전 파괴 효과
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => {
                            createExplosion(
                                enemy.x + Math.random() * enemy.width,
                                enemy.y + Math.random() * enemy.height
                            );
                            createTankDebris(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color);
                        }, i * 200);
                    }
                    enemy.destroyed = true;

                    if (gameMode === 1) {
                        // 1P 모드
                        if (enemyNum === 2) {
                            // P1이 AI를 이김
                            score += 100 * aiLevel;
                            scoreDiv.textContent = 'SCORE: ' + score;
                            playVictorySound();  // 라운드 승리 사운드
                            setTimeout(() => {
                                showMessage(`🎉 승리! +${100 * aiLevel}점 🎉`);
                                setTimeout(() => {
                                    // 다음 라운드 - AI 레벨업!
                                    aiLevel++;
                                    players[1].hp = 3;
                                    players[2].hp = 3;
                                    players[2].destroyed = false;

                                    // 새 라운드 지형/장애물 재생성
                                    generateTerrain();
                                    generateObstacles();
                                    players[1].x = 150;
                                    players[2].x = canvas.width - 210;
                                    updateTankPosition(players[1]);
                                    updateTankPosition(players[2]);

                                    currentTurn = 1;
                                    changeWind();
                                    const accuracy = Math.min(AI_MAX_ACCURACY, AI_BASE_ACCURACY + (aiLevel - 1) * 0.1);
                                    showMessage(`라운드 ${aiLevel} - AI 정확도 ${Math.round(accuracy * 100)}%`);
                                    turnIndicator.textContent = 'P1 차례';
                                    turnIndicator.className = '';
                                    if (ws && ws.readyState === 1) {
                                        ws.send(JSON.stringify({ type: 'turn_change', currentTurn: 1 }));
                                    }
                                }, 1500);
                            }, 500);
                        } else {
                            // AI가 P1을 이김 - 게임 오버
                            setTimeout(() => {
                                playDefeatSound();
                                showGameOver('GAME OVER', `최종 점수: ${score}점`);
                            }, 1000);
                        }
                    } else {
                        // 2P 모드: 승자 결정
                        const winner = currentTurn;
                        setTimeout(() => {
                            playVictorySound();
                            showGameOver('GAME OVER', `P${winner} WIN!`);
                        }, 1000);
                    }
                } else {
                    nextTurn();
                }
                return;
            }
        }

        // 게임 오버 화면 표시
        function showGameOver(title, message) {
            gameActive = false;
            gameOverTitle.textContent = title;
            winnerText.textContent = message;
            gameOverScreen.style.display = 'flex';
            restartBtn.style.display = 'block';
        }

        // 게임 재시작
        function restartGame() {
            gameOverScreen.style.display = 'none';
            restartBtn.style.display = 'none';

            // 상태 초기화
            players[1].hp = 3;
            players[2].hp = 3;
            players[1].destroyed = false;
            players[2].destroyed = false;
            projectile = null;
            explosions = [];
            tankDebris = [];
            windParticles = [];
            score = 0;
            aiLevel = 1;
            scoreDiv.textContent = 'SCORE: 0';

            // 이전 모드 유지하고 바로 게임 시작
            // (모드 선택 화면 안 거침)
            startGame();

            // 컨트롤러에 게임 재시작 알림
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'game_restart', currentTurn: 1 }));
            }
        }

        // 턴 넘기기
        function nextTurn() {
            changeWind();
            playTurnSound();  // 턴 변경 사운드

            if (gameMode === 1) {
                // 1P 모드: P1 → AI → P1 교대
                currentTurn = currentTurn === 1 ? 2 : 1;

                if (currentTurn === 2) {
                    // AI 차례
                    showMessage('AI 차례...');
                    turnIndicator.textContent = 'AI 생각중...';
                    turnIndicator.className = 'aiturn thinking';
                    setTimeout(aiTurn, 1500);  // 1.5초 후 AI 발사
                } else {
                    // P1 차례
                    showMessage('내 차례!');
                    turnIndicator.textContent = 'P1 차례';
                    turnIndicator.className = '';
                    // 컨트롤러에 턴 알림
                    if (ws && ws.readyState === 1) {
                        ws.send(JSON.stringify({ type: 'turn_change', currentTurn: 1 }));
                    }
                }
            } else {
                // 2P 모드: 턴 교대
                currentTurn = currentTurn === 1 ? 2 : 1;
                showMessage(`P${currentTurn} 차례!`);
                turnIndicator.textContent = `P${currentTurn} 차례`;
                turnIndicator.className = currentTurn === 2 ? 'p2turn' : '';
                // 컨트롤러에 턴 알림
                if (ws && ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'turn_change', currentTurn: currentTurn }));
                }
            }

            // UI 업데이트
            angleVal.textContent = players[currentTurn].angle + '°';
            powerVal.textContent = players[currentTurn].power + '%';
        }

        // AI 발사 시뮬레이션 (실제 물리 엔진과 동일)
        function simulateShot(startX, startY, angle, power, targetX) {
            const radians = angle * Math.PI / 180;
            const speed = power * 0.3;
            let x = startX;
            let y = startY;
            let vx = Math.cos(radians) * speed * (-1);  // AI는 왼쪽으로
            let vy = -Math.sin(radians) * speed;

            for (let i = 0; i < 500; i++) {
                vx += wind * 0.01;
                vy += GRAVITY;
                vx *= AIR_RESISTANCE;
                vy *= AIR_RESISTANCE;
                x += vx;
                y += vy;

                // 지형 충돌 체크
                const terrainY = getTerrainY(x);
                if (y > terrainY) {
                    return { hitX: x, hit: false };
                }
                // 타겟 근처에 도달했는지 체크
                if (Math.abs(x - targetX) < 40 && y > players[1].y - 20) {
                    return { hitX: x, hit: true };
                }
            }
            return { hitX: x, hit: false };
        }

        // AI 턴 처리
        function aiTurn() {
            if (!gameActive || projectile) return;

            aiThinking = true;
            const ai = players[2];
            const target = players[1];
            const targetX = target.x + target.width / 2;

            // 최적의 각도와 파워를 찾기 위해 여러 번 시뮬레이션
            let bestAngle = 45;
            let bestPower = 80;
            let bestDistance = Infinity;

            // 다양한 각도와 파워 조합 테스트
            for (let testAngle = 25; testAngle <= 65; testAngle += 5) {
                for (let testPower = 60; testPower <= 100; testPower += 5) {
                    const result = simulateShot(ai.x, ai.y, testAngle, testPower, targetX);
                    const dist = Math.abs(result.hitX - targetX);

                    if (dist < bestDistance) {
                        bestDistance = dist;
                        bestAngle = testAngle;
                        bestPower = testPower;
                    }
                }
            }

            // 현재 AI 정확도 계산 (레벨에 따라 증가)
            const currentAccuracy = Math.min(AI_MAX_ACCURACY, AI_BASE_ACCURACY + (aiLevel - 1) * 0.1);

            // 가끔 일부러 크게 빗나감 (20% 확률)
            const intentionalMiss = Math.random() < 0.2;

            // 오차 계산
            let errorRange = (1 - currentAccuracy) * 25;
            if (intentionalMiss) {
                errorRange *= 2;  // 일부러 빗나갈 때는 오차 2배
            }

            const angleError = (Math.random() - 0.5) * errorRange;
            const powerError = (Math.random() - 0.5) * errorRange;

            ai.angle = Math.max(20, Math.min(70, Math.round(bestAngle + angleError)));
            ai.power = Math.max(50, Math.min(100, Math.round(bestPower + powerError)));

            console.log(`AI Lv.${aiLevel} (정확도: ${Math.round(currentAccuracy*100)}%) - 최적: ${bestAngle}°/${bestPower}% → 실제: ${ai.angle}°/${ai.power}%${intentionalMiss ? ' [의도적 미스]' : ''}`);

            // UI 업데이트
            angleVal.textContent = ai.angle + '°';
            powerVal.textContent = ai.power + '%';

            // 발사 애니메이션 (파워 게이지 움직임)
            let displayPower = 10;
            const targetPower = ai.power;
            const chargeInterval = setInterval(() => {
                displayPower += 5;
                if (displayPower >= targetPower) {
                    displayPower = targetPower;
                    clearInterval(chargeInterval);

                    // 발사!
                    setTimeout(() => {
                        showMessage('AI 발사!');
                        turnIndicator.textContent = 'AI 발사!';
                        turnIndicator.className = 'aiturn';  // thinking 애니메이션 제거
                        fireProjectile(2, ai.angle, ai.power);
                        aiThinking = false;
                    }, 300);
                }
                powerVal.textContent = displayPower + '%';
            }, 50);
        }

        // 메시지 표시
        function showMessage(text) {
            messageDiv.textContent = text;
            messageDiv.classList.add('show');
            setTimeout(() => messageDiv.classList.remove('show'), 1500);
        }

        // 업데이트
        function update() {
            // 탱크 위치를 지형에 맞춤 (매 프레임)
            if (gameActive) {
                updateTankPosition(players[1]);
                updateTankPosition(players[2]);
            }

            if (projectile) {
                // 바람 적용
                projectile.vx += wind * 0.01;
                // 중력 적용
                projectile.vy += GRAVITY;
                // 공기저항
                projectile.vx *= AIR_RESISTANCE;
                projectile.vy *= AIR_RESISTANCE;
                // 위치 업데이트
                projectile.x += projectile.vx;
                projectile.y += projectile.vy;

                checkCollision();
            }

            // 폭발 업데이트
            for (let i = explosions.length - 1; i >= 0; i--) {
                const exp = explosions[i];
                exp.radius += 3;
                exp.alpha -= 0.05;
                if (exp.alpha <= 0) {
                    explosions.splice(i, 1);
                }
            }

            // 탱크 파편 업데이트
            for (let i = tankDebris.length - 1; i >= 0; i--) {
                const d = tankDebris[i];
                d.vy += 0.5;  // 중력
                d.x += d.vx;
                d.y += d.vy;
                d.rotation += d.rotationSpeed;
                d.alpha -= 0.02;

                // 지형에 닿으면 멈춤
                const terrainY = getTerrainY(d.x);
                if (d.y > terrainY) {
                    d.y = terrainY;
                    d.vy = 0;
                    d.vx *= 0.5;
                }

                if (d.alpha <= 0) {
                    tankDebris.splice(i, 1);
                }
            }

            // 바람 파티클 업데이트
            updateWindParticles();

            // 머즐 플래시 업데이트
            if (muzzleFlash) {
                muzzleFlash.alpha -= 0.15;
                muzzleFlash.radius += 5;
                if (muzzleFlash.alpha <= 0) {
                    muzzleFlash = null;
                }
            }

            // 연기 파티클 업데이트
            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                const s = smokeParticles[i];
                s.x += s.vx;
                s.y += s.vy;
                s.vy -= 0.05;  // 위로 떠오름
                s.size += 0.5;
                s.alpha -= 0.02;

                if (s.alpha <= 0) {
                    smokeParticles.splice(i, 1);
                }
            }

            // 포탄 연기 꼬리 추가
            if (projectile && projectile.trail) {
                projectile.trail.push({
                    x: projectile.x,
                    y: projectile.y,
                    alpha: 0.6,
                    size: 6
                });
                // 꼬리 길이 제한
                if (projectile.trail.length > 20) {
                    projectile.trail.shift();
                }
                // 꼬리 페이드 아웃
                for (let i = 0; i < projectile.trail.length; i++) {
                    projectile.trail[i].alpha -= 0.03;
                    projectile.trail[i].size -= 0.1;
                }
            }
        }

        // 그리기
        function draw() {
            // 배경 그라데이션 (더 풍부한 색상)
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#4A90C2');
            gradient.addColorStop(0.3, '#87CEEB');
            gradient.addColorStop(0.6, '#B0E0E6');
            gradient.addColorStop(1, '#E0F4FF');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 태양
            drawSun();

            // 구름 (산 뒤)
            for (const cloud of clouds) {
                drawCloud(cloud);
                // 구름 이동
                cloud.x += cloud.speed + wind * 0.1;
                if (cloud.x > canvas.width + 100) cloud.x = -100;
                if (cloud.x < -100) cloud.x = canvas.width + 100;
            }

            // 먼 산 (layer 0)
            for (const m of mountains.filter(m => m.layer === 0)) {
                drawMountain(m);
            }

            // 가까운 산 (layer 1)
            for (const m of mountains.filter(m => m.layer === 1)) {
                drawMountain(m);
            }

            // 나무 그리기 (지형 앞, 탱크 뒤)
            for (const tree of trees) {
                const treeY = getTerrainY(tree.x);
                // 탱크 위치에 있는 나무는 건너뛰기
                if (Math.abs(tree.x - players[1].x - 30) < 50 ||
                    Math.abs(tree.x - players[2].x - 30) < 50) continue;
                drawTree(tree, treeY);
            }

            // 바람 파티클 그리기
            for (const p of windParticles) {
                ctx.save();
                ctx.globalAlpha = p.alpha;

                if (p.type === 'leaf') {
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation || 0);
                    ctx.fillStyle = '#90EE90';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.size * 2, p.size, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            // 바람 줄무늬 효과 (강한 바람일 때)
            if (Math.abs(wind) > 3) {
                const intensity = Math.min(1, (Math.abs(wind) - 3) / 5);
                ctx.strokeStyle = `rgba(255, 255, 255, ${intensity * 0.15})`;
                ctx.lineWidth = 1;

                const dir = wind > 0 ? 1 : -1;
                const lineCount = Math.floor(intensity * 20);

                for (let i = 0; i < lineCount; i++) {
                    const y = Math.random() * canvas.height * 0.7;
                    const x = Math.random() * canvas.width;
                    const length = 30 + Math.random() * 50;

                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + length * dir, y + (Math.random() - 0.5) * 10);
                    ctx.stroke();
                }
            }

            // 지형 색상 (타입별)
            const terrainColors = {
                'hills': ['#4CAF50', '#388E3C', '#2E7D32', '#1B5E20'],      // 초록 (기본)
                'valley': ['#66BB6A', '#4CAF50', '#43A047', '#388E3C'],     // 연한 초록
                'mountain': ['#78909C', '#607D8B', '#546E7A', '#455A64'],   // 회색 (바위산)
                'plateau': ['#8D6E63', '#795548', '#6D4C41', '#5D4037'],    // 갈색 (흙)
                'canyon': ['#A1887F', '#8D6E63', '#795548', '#5D4037'],     // 연한 갈색
                'stairs': ['#7E57C2', '#673AB7', '#5E35B1', '#4527A0'],     // 보라 (인공)
                'dunes': ['#FFD54F', '#FFCA28', '#FFC107', '#FFB300'],      // 노란색 (모래)
                'cliffs': ['#90A4AE', '#78909C', '#607D8B', '#546E7A']      // 청회색
            };
            const colors = terrainColors[currentTerrainType] || terrainColors['hills'];

            // 지형 그리기 (그라데이션)
            const terrainGradient = ctx.createLinearGradient(0, canvas.height - 200, 0, canvas.height);
            terrainGradient.addColorStop(0, colors[0]);
            terrainGradient.addColorStop(0.3, colors[1]);
            terrainGradient.addColorStop(0.7, colors[2]);
            terrainGradient.addColorStop(1, colors[3]);
            ctx.fillStyle = terrainGradient;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            for (const point of terrainPoints) {
                ctx.lineTo(point.x, point.y);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();
            ctx.fill();

            // 지형 하이라이트 (위쪽 밝은 선) - 지형별 색상
            const highlightColors = {
                'hills': '#81C784',
                'valley': '#A5D6A7',
                'mountain': '#B0BEC5',
                'plateau': '#BCAAA4',
                'canyon': '#D7CCC8',
                'stairs': '#B39DDB',
                'dunes': '#FFE082',
                'cliffs': '#B0BEC5'
            };
            ctx.strokeStyle = highlightColors[currentTerrainType] || '#81C784';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(terrainPoints[0].x, terrainPoints[0].y);
            for (let i = 1; i < terrainPoints.length; i++) {
                ctx.lineTo(terrainPoints[i].x, terrainPoints[i].y);
            }
            ctx.stroke();

            // 지형 디테일 (지형별로 다른 모양)
            const detailColors = {
                'hills': '#1e7b1e',
                'valley': '#2E7D32',
                'mountain': '#546E7A',
                'plateau': '#4E342E',
                'canyon': '#6D4C41',
                'stairs': '#4527A0',
                'dunes': '#F9A825',
                'cliffs': '#455A64'
            };
            ctx.fillStyle = detailColors[currentTerrainType] || '#1e7b1e';

            // 사막은 모래 알갱이, 나머지는 풀
            if (currentTerrainType === 'dunes') {
                // 모래 알갱이
                for (let i = 0; i < terrainPoints.length - 1; i += 2) {
                    const p = terrainPoints[i];
                    ctx.beginPath();
                    ctx.arc(p.x + Math.random() * 10, p.y - 2, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (currentTerrainType === 'mountain' || currentTerrainType === 'cliffs') {
                // 바위 조각
                for (let i = 0; i < terrainPoints.length - 1; i += 5) {
                    const p = terrainPoints[i];
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x + 5, p.y - 6);
                    ctx.lineTo(p.x + 10, p.y);
                    ctx.fill();
                }
            } else {
                // 풀
                for (let i = 0; i < terrainPoints.length - 1; i += 3) {
                    const p = terrainPoints[i];
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x + 8, p.y - 8);
                    ctx.lineTo(p.x + 16, p.y);
                    ctx.fill();
                }
            }

            // 장애물 그리기
            for (const obs of obstacles) {
                if (obs.type === 'rock') {
                    // 바위 (타원형)
                    ctx.fillStyle = '#666';
                    ctx.beginPath();
                    ctx.ellipse(obs.x, obs.y, obs.width / 2, obs.height, 0, Math.PI, 0);
                    ctx.fill();

                    // 바위 하이라이트
                    ctx.fillStyle = '#888';
                    ctx.beginPath();
                    ctx.ellipse(obs.x - obs.width * 0.15, obs.y - obs.height * 0.3, obs.width * 0.2, obs.height * 0.3, 0, Math.PI, 0);
                    ctx.fill();
                } else {
                    // 벽 (사각형)
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                    // 벽 테두리
                    ctx.strokeStyle = '#5D3A1A';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

                    // 벽돌 패턴
                    ctx.strokeStyle = '#5D3A1A';
                    ctx.lineWidth = 1;
                    for (let by = obs.y + 10; by < obs.y + obs.height; by += 15) {
                        ctx.beginPath();
                        ctx.moveTo(obs.x, by);
                        ctx.lineTo(obs.x + obs.width, by);
                        ctx.stroke();
                    }
                }
            }

            // 탱크 그리기 함수 (개선된 그래픽)
            function drawTank(player, playerNum, label) {
                if (player.destroyed) return;

                const terrainAngle = player.terrainAngle || 0;
                const centerX = player.x + player.width / 2;
                const centerY = player.y + player.height / 2;
                const w = player.width;
                const h = player.height;

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(terrainAngle);
                ctx.translate(-w / 2, -h / 2);

                // 피격 효과
                if (player.damaged) {
                    ctx.globalAlpha = 0.5 + Math.random() * 0.5;
                }

                // 그림자
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(w / 2, h + 5, w / 2, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // 캐터필러 트랙 (아래)
                ctx.fillStyle = '#2C2C2C';
                ctx.beginPath();
                ctx.roundRect(-5, h - 15, w + 10, 20, 8);
                ctx.fill();

                // 트랙 디테일
                ctx.fillStyle = '#1a1a1a';
                for (let i = 0; i < 6; i++) {
                    ctx.fillRect(i * 12, h - 12, 8, 14);
                }

                // 바퀴들
                ctx.fillStyle = '#444';
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.arc(10 + i * 15, h - 5, 8, 0, Math.PI * 2);
                    ctx.fill();
                    // 바퀴 중심
                    ctx.fillStyle = '#666';
                    ctx.beginPath();
                    ctx.arc(10 + i * 15, h - 5, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#444';
                }

                // 탱크 몸체 (그라데이션)
                const bodyGrad = ctx.createLinearGradient(0, 0, 0, h);
                const baseColor = player.color;
                bodyGrad.addColorStop(0, lightenColor(baseColor, 30));
                bodyGrad.addColorStop(0.5, baseColor);
                bodyGrad.addColorStop(1, darkenColor(baseColor, 30));
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.roundRect(0, 0, w, h - 10, 5);
                ctx.fill();

                // 몸체 테두리
                ctx.strokeStyle = darkenColor(baseColor, 50);
                ctx.lineWidth = 2;
                ctx.stroke();

                // 포탑 (둥근 모양)
                const turretX = w / 2;
                const turretY = h / 3;
                const turretGrad = ctx.createRadialGradient(turretX - 5, turretY - 5, 0, turretX, turretY, 20);
                turretGrad.addColorStop(0, lightenColor(baseColor, 40));
                turretGrad.addColorStop(1, darkenColor(baseColor, 20));
                ctx.fillStyle = turretGrad;
                ctx.beginPath();
                ctx.arc(turretX, turretY, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = darkenColor(baseColor, 50);
                ctx.lineWidth = 2;
                ctx.stroke();

                // 포신
                ctx.save();
                if (playerNum === 1) {
                    ctx.translate(turretX + 10, turretY);
                    ctx.rotate(-player.angle * Math.PI / 180);
                } else {
                    ctx.translate(turretX - 10, turretY);
                    ctx.rotate((-180 + player.angle) * Math.PI / 180);
                }
                // 포신 그라데이션
                const barrelGrad = ctx.createLinearGradient(0, -6, 0, 6);
                barrelGrad.addColorStop(0, '#555');
                barrelGrad.addColorStop(0.5, '#333');
                barrelGrad.addColorStop(1, '#222');
                ctx.fillStyle = barrelGrad;
                ctx.beginPath();
                ctx.roundRect(0, -6, 45, 12, 2);
                ctx.fill();
                // 포구
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(45, 0, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 피격 시 빨간 오버레이
                if (player.damaged) {
                    ctx.fillStyle = 'rgba(255, 50, 50, 0.4)';
                    ctx.beginPath();
                    ctx.roundRect(0, 0, w, h - 10, 5);
                    ctx.fill();
                }

                // 하이라이트 (빛 반사)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.beginPath();
                ctx.roundRect(5, 3, w - 30, 8, 3);
                ctx.fill();

                ctx.globalAlpha = 1;
                ctx.restore();

                // HP 바 (위에 표시)
                const hpBarWidth = 50;
                const hpBarHeight = 8;
                const hpBarX = centerX - hpBarWidth / 2;
                const hpBarY = player.y - 35;

                // HP 바 배경
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.beginPath();
                ctx.roundRect(hpBarX - 2, hpBarY - 2, hpBarWidth + 4, hpBarHeight + 4, 4);
                ctx.fill();

                // HP 바 빈 부분
                ctx.fillStyle = '#444';
                ctx.fillRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);

                // HP 바 채워진 부분
                const hpPercent = player.hp / 3;
                const hpColor = hpPercent > 0.6 ? '#4CAF50' : hpPercent > 0.3 ? '#FFC107' : '#F44336';
                ctx.fillStyle = hpColor;
                ctx.fillRect(hpBarX, hpBarY, hpBarWidth * hpPercent, hpBarHeight);

                // 플레이어 라벨
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(label, centerX, player.y - 45);
            }

            // 색상 유틸리티 함수
            function lightenColor(color, percent) {
                const num = parseInt(color.replace('#', ''), 16);
                const amt = Math.round(2.55 * percent);
                const R = Math.min(255, (num >> 16) + amt);
                const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
                const B = Math.min(255, (num & 0x0000FF) + amt);
                return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
            }

            function darkenColor(color, percent) {
                const num = parseInt(color.replace('#', ''), 16);
                const amt = Math.round(2.55 * percent);
                const R = Math.max(0, (num >> 16) - amt);
                const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
                const B = Math.max(0, (num & 0x0000FF) - amt);
                return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
            }

            // 플레이어 1 탱크
            const p1 = players[1];
            drawTank(p1, 1, 'P1');

            // 플레이어 2 탱크
            const p2 = players[2];
            const p2Label = gameMode === 1 ? `AI Lv.${aiLevel}` : 'P2';
            drawTank(p2, 2, p2Label);

            // 머즐 플래시
            if (muzzleFlash) {
                ctx.save();
                ctx.globalAlpha = muzzleFlash.alpha;
                const flashGrad = ctx.createRadialGradient(
                    muzzleFlash.x, muzzleFlash.y, 0,
                    muzzleFlash.x, muzzleFlash.y, muzzleFlash.radius
                );
                flashGrad.addColorStop(0, '#FFFFFF');
                flashGrad.addColorStop(0.3, '#FFFF00');
                flashGrad.addColorStop(0.6, '#FFA500');
                flashGrad.addColorStop(1, 'rgba(255, 100, 0, 0)');
                ctx.fillStyle = flashGrad;
                ctx.beginPath();
                ctx.arc(muzzleFlash.x, muzzleFlash.y, muzzleFlash.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 연기 파티클
            for (const s of smokeParticles) {
                ctx.save();
                ctx.globalAlpha = s.alpha;
                ctx.fillStyle = s.type === 'muzzle' ? '#888' : '#666';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 포탄
            if (projectile) {
                // 연기 꼬리
                if (projectile.trail) {
                    for (let i = 0; i < projectile.trail.length; i++) {
                        const t = projectile.trail[i];
                        if (t.alpha > 0 && t.size > 0) {
                            ctx.save();
                            ctx.globalAlpha = t.alpha * 0.5;
                            ctx.fillStyle = '#888';
                            ctx.beginPath();
                            ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        }
                    }
                }

                // 포탄 본체 (그라데이션)
                const projGrad = ctx.createRadialGradient(
                    projectile.x - 2, projectile.y - 2, 0,
                    projectile.x, projectile.y, projectile.radius
                );
                projGrad.addColorStop(0, '#666');
                projGrad.addColorStop(0.5, '#333');
                projGrad.addColorStop(1, '#111');
                ctx.fillStyle = projGrad;
                ctx.beginPath();
                ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
                ctx.fill();

                // 포탄 하이라이트
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(projectile.x - 2, projectile.y - 2, projectile.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }

            // 예상 궤적 (발사 전)
            if (!projectile && gameActive) {
                drawTrajectory();
            }

            // 폭발 (개선된 효과)
            for (const exp of explosions) {
                // 외부 폭발
                const outerGrad = ctx.createRadialGradient(exp.x, exp.y, 0, exp.x, exp.y, exp.radius);
                outerGrad.addColorStop(0, `rgba(255, 200, 50, ${exp.alpha})`);
                outerGrad.addColorStop(0.4, `rgba(255, 100, 0, ${exp.alpha * 0.8})`);
                outerGrad.addColorStop(0.7, `rgba(200, 50, 0, ${exp.alpha * 0.5})`);
                outerGrad.addColorStop(1, `rgba(100, 20, 0, 0)`);
                ctx.fillStyle = outerGrad;
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
                ctx.fill();

                // 내부 밝은 핵
                const innerGrad = ctx.createRadialGradient(exp.x, exp.y, 0, exp.x, exp.y, exp.radius * 0.4);
                innerGrad.addColorStop(0, `rgba(255, 255, 255, ${exp.alpha})`);
                innerGrad.addColorStop(0.5, `rgba(255, 255, 150, ${exp.alpha * 0.8})`);
                innerGrad.addColorStop(1, `rgba(255, 200, 50, 0)`);
                ctx.fillStyle = innerGrad;
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, exp.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();

                // 불꽃 파티클
                ctx.fillStyle = `rgba(255, 150, 50, ${exp.alpha * 0.8})`;
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2 + exp.radius * 0.1;
                    const dist = exp.radius * (0.5 + Math.random() * 0.3);
                    const px = exp.x + Math.cos(angle) * dist;
                    const py = exp.y + Math.sin(angle) * dist;
                    ctx.beginPath();
                    ctx.arc(px, py, 5 + Math.random() * 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 탱크 파편
            for (const d of tankDebris) {
                ctx.save();
                ctx.translate(d.x, d.y);
                ctx.rotate(d.rotation);
                ctx.globalAlpha = d.alpha;
                // 파편 그라데이션
                const debrisGrad = ctx.createLinearGradient(-d.size/2, -d.size/2, d.size/2, d.size/2);
                debrisGrad.addColorStop(0, lightenColor(d.color, 20));
                debrisGrad.addColorStop(1, darkenColor(d.color, 20));
                ctx.fillStyle = debrisGrad;
                ctx.fillRect(-d.size / 2, -d.size / 2, d.size, d.size);
                ctx.restore();
            }

            // 바람 표시
            if (gameActive) {
                const windX = canvas.width / 2;
                const windY = 50;
                const absWind = Math.abs(wind);

                // 배경
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath();
                ctx.roundRect(windX - 100, windY - 25, 200, 50, 10);
                ctx.fill();

                // 바람 세기에 따른 색상
                let windColor;
                if (absWind < 2) windColor = '#4CAF50';      // 약함 - 초록
                else if (absWind < 4) windColor = '#FFC107'; // 중간 - 노랑
                else windColor = '#F44336';                   // 강함 - 빨강

                // 바람 방향 화살표들
                const arrowCount = Math.min(5, Math.ceil(absWind / 2));
                const dir = wind > 0 ? 1 : -1;

                ctx.fillStyle = windColor;
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';

                // 화살표 애니메이션 (시간에 따라 움직임)
                const time = Date.now() / 200;
                let arrows = '';
                for (let i = 0; i < arrowCount; i++) {
                    arrows += wind > 0 ? '›' : '‹';
                }

                // 화살표 그리기 (애니메이션)
                const offset = (time % 1) * 10 * dir;
                ctx.fillText(arrows, windX + offset, windY + 8);

                // 바람 수치
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.fillText(`${absWind.toFixed(1)} m/s`, windX, windY - 12);

                // 바람 게이지 바
                const gaugeWidth = 80;
                const gaugeHeight = 6;
                const gaugeX = windX - gaugeWidth / 2;
                const gaugeY = windY + 15;

                // 게이지 배경
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(gaugeX, gaugeY, gaugeWidth, gaugeHeight);

                // 게이지 채움
                const fillWidth = (absWind / 5) * (gaugeWidth / 2);
                ctx.fillStyle = windColor;
                if (wind > 0) {
                    ctx.fillRect(gaugeX + gaugeWidth / 2, gaugeY, fillWidth, gaugeHeight);
                } else {
                    ctx.fillRect(gaugeX + gaugeWidth / 2 - fillWidth, gaugeY, fillWidth, gaugeHeight);
                }

                // 중앙 마커
                ctx.fillStyle = '#fff';
                ctx.fillRect(gaugeX + gaugeWidth / 2 - 1, gaugeY - 2, 2, gaugeHeight + 4);
            }
        }

        // 예상 궤적 그리기
        function drawTrajectory() {
            const player = players[currentTurn];
            const enemy = players[currentTurn === 1 ? 2 : 1];
            const radians = player.angle * Math.PI / 180;
            const speed = player.power * 0.3;
            const direction = currentTurn === 1 ? 1 : -1;
            let vx = Math.cos(radians) * speed * direction;
            let vy = -Math.sin(radians) * speed;
            let x = currentTurn === 1 ? player.x + player.width : player.x;
            let y = player.y;

            // 먼저 전체 궤적을 계산
            const trajectoryPoints = [{x, y}];
            let hitEnemy = false;
            let totalSteps = 0;

            for (let i = 0; i < 200; i++) {
                vx += wind * 0.01;
                vy += GRAVITY;
                vx *= AIR_RESISTANCE;
                vy *= AIR_RESISTANCE;
                x += vx;
                y += vy;

                // 지형 충돌 체크
                const terrainY = getTerrainY(x);
                if (y > terrainY) {
                    trajectoryPoints.push({x, y: terrainY});
                    totalSteps = i + 1;
                    break;
                }

                // 장애물 충돌 체크
                if (checkObstacleCollision(x, y)) {
                    trajectoryPoints.push({x, y});
                    totalSteps = i + 1;
                    break;
                }

                // 적 탱크 충돌 체크
                if (!enemy.destroyed &&
                    x > enemy.x && x < enemy.x + enemy.width &&
                    y > enemy.y && y < enemy.y + enemy.height) {
                    hitEnemy = true;
                    trajectoryPoints.push({x, y});
                    totalSteps = i + 1;
                    break;
                }

                // 화면 밖
                if (x < 0 || x > canvas.width || y < -500) {
                    totalSteps = i + 1;
                    break;
                }

                trajectoryPoints.push({x, y});
                totalSteps = i + 1;
            }

            // 80%만 그리기 (마지막 20%는 숨김)
            const visibleRatio = 0.8;
            const visibleCount = Math.floor(trajectoryPoints.length * visibleRatio);

            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(trajectoryPoints[0].x, trajectoryPoints[0].y);

            for (let i = 1; i < visibleCount; i++) {
                // 끝에 가까워질수록 페이드아웃
                const fadeStart = visibleCount * 0.7;
                if (i > fadeStart) {
                    const alpha = 0.5 * (1 - (i - fadeStart) / (visibleCount - fadeStart));
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(trajectoryPoints[i-1].x, trajectoryPoints[i-1].y);
                    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                }
                ctx.lineTo(trajectoryPoints[i].x, trajectoryPoints[i].y);
            }

            ctx.stroke();
            ctx.setLineDash([]);

            // 궤적 끝 부분에 "?" 표시 (예측 필요 힌트)
            if (visibleCount > 0 && visibleCount < trajectoryPoints.length) {
                const lastVisible = trajectoryPoints[visibleCount - 1];
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('?', lastVisible.x, lastVisible.y - 10);
            }
        }

        // 게임 루프
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 게임 시작
        function startGame() {
            gameActive = true;
            startBtn.style.display = 'none';
            modeSelect.style.display = 'none';
            readyStatus.style.display = 'none';
            currentTurn = 1;
            players[1].hp = 3;
            players[2].hp = 3;

            // 새 라운드마다 지형 재생성
            generateTerrain();

            // 장애물 생성
            generateObstacles();

            // 탱크 위치 초기화 및 지형에 맞춤
            players[1].x = 150;
            players[2].x = canvas.width - 210;
            players[1].destroyed = false;
            players[2].destroyed = false;
            updateTankPosition(players[1]);
            updateTankPosition(players[2]);

            changeWind();
            playGameStartSound();  // 게임 시작 사운드

            if (gameMode === 1) {
                aiLevel = 1;  // AI 레벨 초기화
                score = 0;
                scoreDiv.textContent = 'SCORE: 0';
                turnIndicator.textContent = 'P1 차례';
                turnIndicator.className = '';
                showMessage('라운드 1 - AI 정확도 50%');
            } else {
                turnIndicator.textContent = 'P1 차례';
                turnIndicator.className = '';
                showMessage('P1 차례!');
            }

            // 컨트롤러에 게임 시작 알림
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'game_start', currentTurn: 1 }));
            }
        }

        // 마우스/키보드 컨트롤 (테스트용)
        startBtn.onclick = startGame;

        document.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            const player = players[currentTurn];
            if (e.key === 'ArrowUp') player.angle = Math.min(85, player.angle + 2);
            if (e.key === 'ArrowDown') player.angle = Math.max(5, player.angle - 2);
            if (e.key === 'ArrowRight') player.power = Math.min(100, player.power + 5);
            if (e.key === 'ArrowLeft') player.power = Math.max(10, player.power - 5);
            if (e.key === ' ' && !projectile) fireProjectile(currentTurn, player.angle, player.power);

            angleVal.textContent = player.angle + '°';
            powerVal.textContent = player.power + '%';
        });

        // 다시 시작 버튼
        restartBtn.onclick = restartGame;

        // 배경 초기화
        initBackground();

        connect();
        gameLoop();
    </script>
</body>
</html>
