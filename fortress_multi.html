                    ctx.fill();

                    // 바위 테두리
                    ctx.strokeStyle = '#3A3A3A';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // 바위 하이라이트
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.beginPath();
                    ctx.ellipse(obs.x - obs.width * 0.15, obs.y - obs.height * 0.5, obs.width * 0.2, obs.height * 0.3, -0.3, 0, Math.PI * 2);
                    ctx.fill();

                    // 데미지 금 표시
                    if (obs.hp < obs.maxHp) {
                        ctx.strokeStyle = '#222';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(obs.x - obs.width * 0.2, obs.y - obs.height * 0.3);
                        ctx.lineTo(obs.x + obs.width * 0.1, obs.y - obs.height * 0.6);
                        ctx.lineTo(obs.x - obs.width * 0.1, obs.y - obs.height * 0.2);
                        ctx.stroke();
                    }
                    ctx.restore();
                } else {
                    // 벽 (사각형)
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    const wallGrad = ctx.createLinearGradient(obs.x, obs.y, obs.x + obs.width, obs.y);
                    wallGrad.addColorStop(0, '#A0522D');
                    wallGrad.addColorStop(0.5, '#8B4513');
                    wallGrad.addColorStop(1, '#654321');
                    ctx.fillStyle = wallGrad;
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                    // 벽 테두리
                    ctx.strokeStyle = '#3E2723';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

                    // 벽돌 패턴
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.lineWidth = 1;
                    const brickHeight = 15;
                    for (let by = obs.y; by < obs.y + obs.height; by += brickHeight) {
                        ctx.beginPath();
                        ctx.moveTo(obs.x, by);
                        ctx.lineTo(obs.x + obs.width, by);
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            }

            // 탱크들 (실제 플레이어)
            for (const [id, p] of Object.entries(players)) {
                if (!p.tank || p.tank.eliminated) continue;
                drawTank(p.tank);
            }

            // AI 탱크들
            for (const ai of aiTanks) {
                if (!ai.eliminated) {
                    drawTank(ai);
                }
            }

            // 포탄들
            for (const proj of projectiles) {
                // 꼬리
                for (const t of proj.trail) {
                    ctx.save();
                    ctx.globalAlpha = t.alpha * 0.3;
                    ctx.fillStyle = '#666';
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // 포탄
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, proj.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 폭발
            for (const exp of explosions) {
                const grad = ctx.createRadialGradient(exp.x, exp.y, 0, exp.x, exp.y, exp.radius);
                grad.addColorStop(0, `rgba(255, 200, 50, ${exp.alpha})`);
                grad.addColorStop(0.5, `rgba(255, 100, 0, ${exp.alpha * 0.5})`);
                grad.addColorStop(1, `rgba(100, 20, 0, 0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 머즐 플래시
            for (const flash of muzzleFlashes) {
                ctx.save();
                ctx.globalAlpha = flash.alpha;

                // 외부 광채
                const flashGrad = ctx.createRadialGradient(flash.x, flash.y, 0, flash.x, flash.y, flash.radius);
                flashGrad.addColorStop(0, 'rgba(255, 255, 200, 1)');
                flashGrad.addColorStop(0.3, 'rgba(255, 200, 50, 0.8)');
                flashGrad.addColorStop(0.6, 'rgba(255, 100, 0, 0.4)');
                flashGrad.addColorStop(1, 'rgba(255, 50, 0, 0)');
                ctx.fillStyle = flashGrad;
                ctx.beginPath();
                ctx.arc(flash.x, flash.y, flash.radius, 0, Math.PI * 2);
                ctx.fill();

                // 중심 밝은 부분
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath();
                ctx.arc(flash.x, flash.y, flash.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // 연기 파티클
            for (const smoke of smokeParticles) {
                ctx.save();
                ctx.globalAlpha = smoke.alpha;

                const smokeGrad = ctx.createRadialGradient(smoke.x, smoke.y, 0, smoke.x, smoke.y, smoke.size);
                if (smoke.type === 'muzzle') {
                    // 발사 연기 (밝은 회색)
                    smokeGrad.addColorStop(0, 'rgba(200, 200, 200, 0.8)');
                    smokeGrad.addColorStop(0.5, 'rgba(150, 150, 150, 0.5)');
                    smokeGrad.addColorStop(1, 'rgba(100, 100, 100, 0)');
                } else {
                    // 일반 연기 (어두운 회색)
                    smokeGrad.addColorStop(0, 'rgba(80, 80, 80, 0.6)');
                    smokeGrad.addColorStop(0.5, 'rgba(60, 60, 60, 0.3)');
                    smokeGrad.addColorStop(1, 'rgba(40, 40, 40, 0)');
                }
                ctx.fillStyle = smokeGrad;
                ctx.beginPath();
                ctx.arc(smoke.x, smoke.y, smoke.size, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // 탱크 파편 그리기
            for (const d of tankDebris) {
                ctx.save();
                ctx.translate(d.x, d.y);
                ctx.rotate(d.rotation);
                ctx.globalAlpha = d.alpha;
                ctx.fillStyle = d.color;
                ctx.fillRect(-d.size / 2, -d.size / 2, d.size, d.size);
                ctx.restore();
            }

            // 예상 궤적 그리기 (각 탱크별)
            for (const [id, p] of Object.entries(players)) {
                if (!p.tank || p.tank.eliminated) continue;
                drawTrajectory(p.tank);
            }
            for (const ai of aiTanks) {
                if (!ai.eliminated) {
                    drawTrajectory(ai);
                }
            }

            ctx.restore();
        }

        // 예상 궤적 그리기 함수
        function drawTrajectory(tank) {
            // 지형 기울기를 반영한 실제 발사 각도
            const terrainAngle = tank.terrainAngle || 0;
            const cannonRadians = tank.angle * Math.PI / 180;
            const direction = tank.team === 'red' ? 1 : -1;
            const actualRadians = cannonRadians - terrainAngle * direction;
            const speed = tank.power * 0.3 * SPEED_SCALE;

            let vx = Math.cos(actualRadians) * speed * direction;
            let vy = -Math.sin(actualRadians) * speed;
            let x = tank.x + tank.width / 2 + Math.cos(actualRadians * direction) * 50;
            let y = tank.y + tank.height / 3 - Math.sin(actualRadians) * 50;

            // 궤적 포인트 계산
            const trajectoryPoints = [{x, y}];

            for (let i = 0; i < 150; i++) {
                vx += wind * 0.01;
                vy += GRAVITY;
                vx *= AIR_RESISTANCE;
                vy *= AIR_RESISTANCE;
                x += vx;
                y += vy;

                // 지형 충돌
                const terrainY = getTerrainY(x);
                if (y > terrainY) {
                    trajectoryPoints.push({x, y: terrainY});
                    break;
                }

                // 장애물 충돌
                if (checkObstacleCollision(x, y).hit) {
                    trajectoryPoints.push({x, y});
                    break;
                }

                // 화면 밖
                if (x < 0 || x > MAP_WIDTH || y < -500) {
                    break;
                }

                trajectoryPoints.push({x, y});
            }

            // 100% 표시 (전체 궤적)
            const visibleRatio = 1.0;
            const visibleCount = Math.floor(trajectoryPoints.length * visibleRatio);

            if (visibleCount < 2) return;

            // 팀 색상으로 궤적 표시
            const baseColor = tank.team === 'red' ? '255, 100, 100' : '100, 150, 255';

            ctx.strokeStyle = `rgba(${baseColor}, 0.5)`;
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(trajectoryPoints[0].x, trajectoryPoints[0].y);

            for (let i = 1; i < visibleCount; i++) {
                // 끝에 가까워질수록 페이드아웃
                const fadeStart = visibleCount * 0.6;
                if (i > fadeStart) {
                    const alpha = 0.5 * (1 - (i - fadeStart) / (visibleCount - fadeStart));
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(trajectoryPoints[i-1].x, trajectoryPoints[i-1].y);
                    ctx.strokeStyle = `rgba(${baseColor}, ${alpha})`;
                }
                ctx.lineTo(trajectoryPoints[i].x, trajectoryPoints[i].y);
            }

            ctx.stroke();
            ctx.setLineDash([]);

            // 궤적 끝 부분에 "?" 표시
            if (visibleCount > 0 && visibleCount < trajectoryPoints.length) {
                const lastVisible = trajectoryPoints[visibleCount - 1];
                ctx.fillStyle = `rgba(${baseColor}, 0.7)`;
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('?', lastVisible.x, lastVisible.y - 10);
            }
        }

        function drawTank(tank) {
            const centerX = tank.x + tank.width / 2;
            const centerY = tank.y + tank.height / 2;
            const w = tank.width;
            const h = tank.height;

            // 내 탱크인지 확인
            const isMyTank = myPlayerName && tank.name === myPlayerName;

            ctx.save();
            ctx.translate(centerX, centerY);

            // 지형 기울기에 따라 탱크 회전
            ctx.rotate(tank.terrainAngle || 0);

            ctx.translate(-w / 2, -h / 2);

            // 피격 효과 (깜빡임)
            if (tank.damaged) {
                ctx.globalAlpha = 0.5 + Math.random() * 0.5;
            }

            // 그림자
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(w / 2, h + 5, w / 2, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // 캐터필러 트랙
            ctx.fillStyle = '#2C2C2C';
            ctx.beginPath();
            ctx.roundRect(-5, h - 15, w + 10, 20, 8);
            ctx.fill();

            // 트랙 디테일
            ctx.fillStyle = '#1a1a1a';
            for (let i = 0; i < 6; i++) {
                ctx.fillRect(i * 12, h - 12, 8, 14);
            }

            // 바퀴들
            ctx.fillStyle = '#444';
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.arc(10 + i * 15, h - 5, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#666';
                ctx.beginPath();
                ctx.arc(10 + i * 15, h - 5, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#444';
            }

            // 탱크 몸체 (그라데이션)
            const baseColor = tank.color;
            const bodyGrad = ctx.createLinearGradient(0, 0, 0, h);
            bodyGrad.addColorStop(0, lightenColor(baseColor, 30));
            bodyGrad.addColorStop(0.5, baseColor);
            bodyGrad.addColorStop(1, darkenColor(baseColor, 30));
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.roundRect(0, 0, w, h - 10, 5);
            ctx.fill();

            // 몸체 테두리
            ctx.strokeStyle = darkenColor(baseColor, 50);
            ctx.lineWidth = 2;
            ctx.stroke();

            // 포탑 (둥근 모양)
            const turretX = w / 2;
            const turretY = h / 3;
            const turretGrad = ctx.createRadialGradient(turretX - 5, turretY - 5, 0, turretX, turretY, 20);
            turretGrad.addColorStop(0, lightenColor(baseColor, 40));
            turretGrad.addColorStop(1, darkenColor(baseColor, 20));
            ctx.fillStyle = turretGrad;
            ctx.beginPath();
            ctx.arc(turretX, turretY, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = darkenColor(baseColor, 50);
            ctx.lineWidth = 2;
            ctx.stroke();

            // 포신
            ctx.save();
            if (tank.team === 'red') {
                ctx.translate(turretX + 10, turretY);
                ctx.rotate(-tank.angle * Math.PI / 180);
            } else {
                ctx.translate(turretX - 10, turretY);
                ctx.rotate((-180 + tank.angle) * Math.PI / 180);
            }

            const barrelGrad = ctx.createLinearGradient(0, -6, 0, 6);
            barrelGrad.addColorStop(0, '#555');
            barrelGrad.addColorStop(0.5, '#333');
            barrelGrad.addColorStop(1, '#222');
            ctx.fillStyle = barrelGrad;
            ctx.beginPath();
            ctx.roundRect(0, -6, 45, 12, 2);
            ctx.fill();

            // 포구
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(45, 0, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 하이라이트 (빛 반사)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.beginPath();
            ctx.roundRect(5, 3, w - 30, 8, 3);
            ctx.fill();

            // 피격 시 빨간 오버레이
            if (tank.damaged) {
                ctx.fillStyle = 'rgba(255, 50, 50, 0.4)';
                ctx.beginPath();
                ctx.roundRect(0, 0, w, h - 10, 5);
                ctx.fill();
            }

            ctx.restore();

            // HP 바
            const hpBarWidth = 50;
            const hpBarX = centerX - hpBarWidth / 2;
            const hpBarY = tank.y - 35;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.beginPath();
            ctx.roundRect(hpBarX - 2, hpBarY - 2, hpBarWidth + 4, 12, 4);
            ctx.fill();

            ctx.fillStyle = '#444';
            ctx.fillRect(hpBarX, hpBarY, hpBarWidth, 8);

            const hpPercent = tank.lives / 3;
            const hpColor = hpPercent > 0.6 ? '#4CAF50' : hpPercent > 0.3 ? '#FFC107' : '#F44336';
            ctx.fillStyle = hpColor;
            ctx.fillRect(hpBarX, hpBarY, hpBarWidth * hpPercent, 8);

            // 이름
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.strokeText(tank.name, centerX, tank.y - 42);
            ctx.fillText(tank.name, centerX, tank.y - 42);

            // 내 탱크 표시 (▼ 마커)
            if (isMyTank) {
                ctx.fillStyle = '#FFD700';  // 골드색
                ctx.font = 'bold 16px Arial';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeText('▼', centerX, tank.y - 55);
                ctx.fillText('▼', centerX, tank.y - 55);
            }

            // 쿨다운 표시
            const now = Date.now();
            if (tank.cooldown > now) {
                const remaining = (tank.cooldown - now) / FIRE_COOLDOWN;
                ctx.fillStyle = 'rgba(255, 150, 0, 0.7)';
                ctx.fillRect(hpBarX, hpBarY + 10, hpBarWidth * remaining, 4);
            }
        }

        // ============ 사운드 시스템 ============
        let audioCtx = null;
        let windOscillator = null;
        let windGain = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        // 대포 발사음 (클래식 대포 - 둔탁한 쾅! 소리)
        function playFireSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // 메인 붐 소리 (깊고 둔탁한 저주파)
                const osc1 = ctx.createOscillator();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(80, now);
                osc1.frequency.exponentialRampToValueAtTime(20, now + 0.4);

                const gain1 = ctx.createGain();
                gain1.gain.setValueAtTime(0.9, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

                // 중간 톤 (울림감)
                const osc2 = ctx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(120, now);
                osc2.frequency.exponentialRampToValueAtTime(40, now + 0.3);

                const gain2 = ctx.createGain();
                gain2.gain.setValueAtTime(0.5, now);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                // 화약 폭발 노이즈 (거친 느낌)
                const bufferSize = ctx.sampleRate * 0.4;
                const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const noiseData = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const envelope = Math.exp(-i / (bufferSize * 0.08));
                    noiseData[i] = (Math.random() * 2 - 1) * envelope;
                }

                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = noiseBuffer;

                const noiseFilter = ctx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.setValueAtTime(600, now);
                noiseFilter.frequency.exponentialRampToValueAtTime(150, now + 0.3);

                const noiseGain = ctx.createGain();
                noiseGain.gain.setValueAtTime(0.6, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                // 잔향 (메아리 효과)
                const osc3 = ctx.createOscillator();
                osc3.type = 'sine';
                osc3.frequency.setValueAtTime(60, now + 0.1);
                osc3.frequency.exponentialRampToValueAtTime(25, now + 0.6);

                const gain3 = ctx.createGain();
                gain3.gain.setValueAtTime(0, now);
                gain3.gain.setValueAtTime(0.3, now + 0.1);
                gain3.gain.exponentialRampToValueAtTime(0.01, now + 0.7);

                // 연결
                osc1.connect(gain1); gain1.connect(ctx.destination);
                osc2.connect(gain2); gain2.connect(ctx.destination);
                noiseSource.connect(noiseFilter);
                noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination);
                osc3.connect(gain3); gain3.connect(ctx.destination);

                osc1.start(now); osc1.stop(now + 0.5);
                osc2.start(now); osc2.stop(now + 0.35);
                noiseSource.start(now);
                osc3.start(now); osc3.stop(now + 0.7);
            } catch(e) {}
        }

        // 폭발 소리 (강력한 임팩트)
        function playExplosionSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // 메인 폭발 노이즈
                const bufferSize = ctx.sampleRate * 0.8;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const envelope = Math.exp(-i / (bufferSize * 0.15));
                    data[i] = (Math.random() * 2 - 1) * envelope;
                }

                const source = ctx.createBufferSource();
                source.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, now);
                filter.frequency.exponentialRampToValueAtTime(200, now + 0.5);

                // 저주파 붐
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.4);

                const oscGain = ctx.createGain();
                oscGain.gain.setValueAtTime(0.7, now);
                oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

                // 컴프레서 (펀치감)
                const compressor = ctx.createDynamicsCompressor();
                compressor.threshold.value = -20;
                compressor.knee.value = 10;
                compressor.ratio.value = 8;
                compressor.attack.value = 0.001;
                compressor.release.value = 0.1;

                const masterGain = ctx.createGain();
                masterGain.gain.value = 0.7;

                source.connect(filter);
                filter.connect(compressor);
                osc.connect(oscGain);
                oscGain.connect(compressor);
                compressor.connect(masterGain);
                masterGain.connect(ctx.destination);

                source.start(now);
                osc.start(now);
                osc.stop(now + 0.5);
            } catch(e) {}
        }

        // 탱크 피격음 (금속 충격)
        function playHitSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // 금속 충격음
                const osc1 = ctx.createOscillator();
                osc1.type = 'square';
                osc1.frequency.setValueAtTime(400, now);
                osc1.frequency.exponentialRampToValueAtTime(100, now + 0.1);

                const gain1 = ctx.createGain();
                gain1.gain.setValueAtTime(0.4, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                // 공명음
                const osc2 = ctx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(600, now);

                const gain2 = ctx.createGain();
                gain2.gain.setValueAtTime(0.2, now);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                // 노이즈 버스트
                const bufferSize = ctx.sampleRate * 0.1;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.02));
                }
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const noiseGain = ctx.createGain();
                noiseGain.gain.value = 0.3;

                const filter = ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 2000;

                osc1.connect(gain1); gain1.connect(ctx.destination);
                osc2.connect(gain2); gain2.connect(ctx.destination);
                noise.connect(filter);
                filter.connect(noiseGain); noiseGain.connect(ctx.destination);

                osc1.start(now); osc1.stop(now + 0.15);
                osc2.start(now); osc2.stop(now + 0.3);
                noise.start(now);
            } catch(e) {}
        }

        // 승리 사운드
        function playVictorySound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const notes = [523, 659, 784, 1047]; // C5, E5, G5, C6
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    osc.type = 'square';
                    osc.frequency.value = freq;

                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0, now + i * 0.15);
                    gain.gain.linearRampToValueAtTime(0.2, now + i * 0.15 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.3);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.15);
                    osc.stop(now + i * 0.15 + 0.35);
                });
            } catch(e) {}
        }

        // 패배 사운드
        function playDefeatSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const notes = [400, 350, 300, 200];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    osc.type = 'sawtooth';
                    osc.frequency.value = freq;

                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0, now + i * 0.2);
                    gain.gain.linearRampToValueAtTime(0.15, now + i * 0.2 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.2 + 0.3);

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 800;

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.2);
                    osc.stop(now + i * 0.2 + 0.35);
                });
            } catch(e) {}
        }

        // 게임 시작 사운드
        function playGameStartSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                for (let i = 0; i < 6; i++) {
                    const osc = ctx.createOscillator();
                    osc.type = 'square';
                    osc.frequency.value = 200 + i * 50;

                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0, now + i * 0.08);
                    gain.gain.linearRampToValueAtTime(0.15 + i * 0.03, now + i * 0.08 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.1);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.15);
                }
            } catch(e) {}
        }

        // 바람 소리 업데이트
        function updateWindSound() {
            try {
                const ctx = getAudioContext();
                const absWind = Math.abs(wind);

                if (absWind < 1) {
                    if (windGain) {
                        windGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
                    }
                    return;
                }

                if (!windOscillator) {
                    const bufferSize = ctx.sampleRate * 2;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }

                    windOscillator = ctx.createBufferSource();
                    windOscillator.buffer = buffer;
                    windOscillator.loop = true;

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 400;
                    filter.Q.value = 0.5;

                    windGain = ctx.createGain();
                    windGain.gain.value = 0;

                    windOscillator.connect(filter);
                    filter.connect(windGain);
                    windGain.connect(ctx.destination);
                    windOscillator.start();
                }

                const targetVolume = Math.min(0.15, absWind * 0.02);
                windGain.gain.linearRampToValueAtTime(targetVolume, ctx.currentTime + 0.3);
            } catch(e) {}
        }

        // 포탄 휘파람 소리
        function playProjectileSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.linearRampToValueAtTime(400, now + 1.5);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.15, now + 0.5);
                gain.gain.linearRampToValueAtTime(0.01, now + 1.5);

                // 트레몰로 효과
                const lfo = ctx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 15;

                const lfoGain = ctx.createGain();
                lfoGain.gain.value = 0.03;

                lfo.connect(lfoGain);
                lfoGain.connect(gain.gain);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                lfo.start(now);
                osc.stop(now + 1.5);
                lfo.stop(now + 1.5);
            } catch(e) {}
        }

        // 게임 루프
        function gameLoop() {
            updateCamera();
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 오디오 활성화 함수
        function unlockAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;

            // AudioContext 초기화 및 resume
            const ctx = getAudioContext();
            if (ctx.state === 'suspended') {
                ctx.resume();
            }

            // 이벤트 리스너 제거
            document.removeEventListener('click', unlockAudio);
            document.removeEventListener('keydown', unlockAudio);
            document.removeEventListener('touchstart', unlockAudio);

            // 활성화 확인 사운드 (짧은 틱)
            try {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        // 페이지 로드 시 오디오 활성화 리스너 등록
        document.addEventListener('click', unlockAudio);
        document.addEventListener('keydown', unlockAudio);
        document.addEventListener('touchstart', unlockAudio);

        // 이벤트
        startGameBtn.onclick = () => {
            unlockAudio();  // PC에서 직접 시작할 때도 오디오 활성화
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'multi_start_game' }));
            }
        };

        restartBtn.onclick = () => {
            unlockAudio();  // 재시작 버튼 클릭 시에도 오디오 활성화
            // 로비로 직접 리셋
            aiLevel = 1;  // 레벨 초기화
            resetToLobby();

            // 서버에도 알림 (다른 플레이어들에게 전파)
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'multi_restart_game' }));
            }
        };

        // 초기화
        generateTerrain();
        connect();
        gameLoop();
    </script>
</body>
</html>
