<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fortress Controller (10P)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            font-family: Arial, sans-serif;
            touch-action: none;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        #status {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .connected { background: #4CAF50; }
        .disconnected { background: #F44336; }

        /* 로비 화면 */
        #lobbyScreen {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #lobbyScreen h2 {
            margin-bottom: 20px;
            color: #FFD700;
        }

        #nameInput {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .team-select {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }
        .team-btn {
            flex: 1;
            padding: 25px 15px;
            font-size: 18px;
            font-weight: bold;
            border: 3px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .team-btn.red {
            background: rgba(244, 67, 54, 0.3);
            color: #F44336;
            border-color: #F44336;
        }
        .team-btn.blue {
            background: rgba(33, 150, 243, 0.3);
            color: #2196F3;
            border-color: #2196F3;
        }
        .team-btn.selected.red {
            background: #F44336;
            color: white;
        }
        .team-btn.selected.blue {
            background: #2196F3;
            color: white;
        }

        #readyBtn {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }
        #readyBtn:disabled {
            background: #666;
        }
        #readyBtn.ready {
            background: #FF9800;
        }

        /* 게임 시작 버튼 */
        #startGameBtn {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            background: #E91E63;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            display: none;
        }
        #startGameBtn:disabled {
            background: #666;
        }
        #startGameBtn.show {
            display: block;
        }

        /* 아군 수 선택 */
        .team-size-select {
            width: 100%;
            margin-bottom: 15px;
            text-align: center;
        }
        .team-size-select label {
            display: block;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .size-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .size-btn {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            border: 2px solid #666;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .size-btn.selected {
            background: #4CAF50;
            border-color: #4CAF50;
        }

        #waitingInfo {
            margin-top: 20px;
            text-align: center;
            color: #aaa;
            font-size: 14px;
        }

        /* 게임 화면 */
        #gameScreen {
            display: none;
            width: 100%;
            max-width: 350px;
            flex-direction: column;
            align-items: center;
        }

        #myInfo {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            text-align: center;
        }
        #myInfo.red { background: rgba(244, 67, 54, 0.3); border: 2px solid #F44336; }
        #myInfo.blue { background: rgba(33, 150, 243, 0.3); border: 2px solid #2196F3; }
        #myInfo .name { font-size: 24px; font-weight: bold; }
        #myInfo .lives { font-size: 32px; margin-top: 5px; }
        #myInfo .lives.warning { color: #FF9800; }
        #myInfo .lives.danger { color: #F44336; }

        #angleDisplay {
            font-size: 48px;
            font-weight: bold;
            color: #4CAF50;
            background: rgba(0,0,0,0.3);
            padding: 10px 30px;
            border-radius: 15px;
            margin-bottom: 10px;
        }

        #powerSection {
            width: 100%;
            margin: 15px 0;
        }
        #powerBar {
            width: 100%;
            height: 50px;
            background: #333;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            border: 3px solid #555;
        }
        #powerFill {
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, #4CAF50, #FFC107, #F44336);
            transition: width 0.05s;
        }
        #powerValue {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
        }

        #cooldownBar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }
        #cooldownFill {
            height: 100%;
            width: 0%;
            background: #FF9800;
            transition: width 0.1s;
        }
        #cooldownText {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }

        #controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .moveBtn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #444;
            border: 3px solid #666;
            color: white;
            font-size: 28px;
        }
        .moveBtn:active {
            background: #666;
        }

        #fireBtn {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(145deg, #F44336, #B71C1C);
            border: 5px solid white;
            color: white;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        #fireBtn:active {
            transform: scale(0.95);
        }
        #fireBtn:disabled {
            background: #666;
            border-color: #888;
        }

        #sensorBtn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            background: #2196F3;
            border: none;
            border-radius: 10px;
            color: white;
            margin-bottom: 10px;
        }
        #sensorBtn.active {
            background: #4CAF50;
        }

        #eliminatedOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }
        #eliminatedOverlay h1 {
            color: #F44336;
            font-size: 36px;
            margin-bottom: 20px;
        }
        #eliminatedOverlay p {
            color: #aaa;
            font-size: 18px;
        }

        /* AI 레벨 선택 */
        .ai-level-select {
            width: 100%;
            margin-bottom: 15px;
            text-align: center;
        }
        .ai-level-select label {
            display: block;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .level-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .level-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid #666;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .level-btn.selected {
            background: #FF9800;
            border-color: #FF9800;
        }
        .level-btn.hard {
            border-color: #F44336;
        }
        .level-btn.hard.selected {
            background: #F44336;
        }

        /* 재시작 버튼 */
        #restartBtn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            background: #FF5722;
            border: none;
            border-radius: 10px;
            color: white;
            margin-top: 15px;
            cursor: pointer;
        }
        #restartBtnOverlay {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            background: #4CAF50;
            border: none;
            border-radius: 10px;
            color: white;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="status" class="disconnected">연결 중...</div>

    <!-- 로비 화면 -->
    <div id="lobbyScreen">
        <h2>FORTRESS BATTLE</h2>

        <input type="text" id="nameInput" placeholder="닉네임 입력" maxlength="10">

        <!-- 아군 수 선택 -->
        <div class="team-size-select">
            <label>아군 수 (AI 포함)</label>
            <div class="size-buttons">
                <button class="size-btn" data-size="1">1</button>
                <button class="size-btn" data-size="2">2</button>
                <button class="size-btn selected" data-size="3">3</button>
                <button class="size-btn" data-size="4">4</button>
                <button class="size-btn" data-size="5">5</button>
            </div>
        </div>

        <!-- AI 레벨 선택 -->
        <div class="ai-level-select">
            <label>AI 난이도 (6부터 어려움)</label>
            <div class="level-buttons">
                <button class="level-btn selected" data-level="1">1</button>
                <button class="level-btn" data-level="2">2</button>
                <button class="level-btn" data-level="3">3</button>
                <button class="level-btn" data-level="4">4</button>
                <button class="level-btn" data-level="5">5</button>
                <button class="level-btn hard" data-level="6">6</button>
                <button class="level-btn hard" data-level="7">7</button>
                <button class="level-btn hard" data-level="8">8</button>
                <button class="level-btn hard" data-level="9">9</button>
                <button class="level-btn hard" data-level="10">10</button>
            </div>
        </div>

        <div class="team-select">
            <button class="team-btn red" id="redTeamBtn">RED<br>TEAM</button>
            <button class="team-btn blue" id="blueTeamBtn">BLUE<br>TEAM</button>
        </div>

        <button id="readyBtn" disabled>준비!</button>
        <button id="startGameBtn" disabled>🎮 게임 시작!</button>

        <div id="waitingInfo">팀을 선택하고 준비 버튼을 눌러주세요</div>
    </div>

    <!-- 게임 화면 -->
    <div id="gameScreen">
        <div id="myInfo" class="red">
            <div class="name" id="myName">Player</div>
            <div class="lives" id="myLives">♥♥♥</div>
        </div>

        <button id="sensorBtn">센서 시작</button>

        <div id="angleDisplay">45°</div>

        <div id="powerSection">
            <div id="powerBar">
                <div id="powerFill" style="width: 100%"></div>
                <span id="powerValue">100%</span>
            </div>
            <div id="cooldownBar">
                <div id="cooldownFill"></div>
            </div>
            <div id="cooldownText">발사 준비 완료</div>
        </div>

        <div id="controls">
            <button class="moveBtn" id="leftBtn">◀</button>
            <button id="fireBtn">FIRE!</button>
            <button class="moveBtn" id="rightBtn">▶</button>
        </div>

        <button id="restartBtn">🔄 게임 재시작</button>
    </div>

    <!-- 탈락 오버레이 -->
    <div id="eliminatedOverlay">
        <h1>탈락!</h1>
        <p>다음 게임을 기다려주세요</p>
        <button id="restartBtnOverlay">🔄 새 게임 시작</button>
    </div>

    <script>
        // 요소
        const status = document.getElementById('status');
        const lobbyScreen = document.getElementById('lobbyScreen');
        const gameScreen = document.getElementById('gameScreen');
        const nameInput = document.getElementById('nameInput');
        const redTeamBtn = document.getElementById('redTeamBtn');
        const blueTeamBtn = document.getElementById('blueTeamBtn');
        const readyBtn = document.getElementById('readyBtn');
        const waitingInfo = document.getElementById('waitingInfo');
        const myInfo = document.getElementById('myInfo');
        const myName = document.getElementById('myName');
        const myLives = document.getElementById('myLives');
        const sensorBtn = document.getElementById('sensorBtn');
        const angleDisplay = document.getElementById('angleDisplay');
        const powerBar = document.getElementById('powerBar');
        const powerFill = document.getElementById('powerFill');
        const powerValue = document.getElementById('powerValue');
        const cooldownFill = document.getElementById('cooldownFill');
        const cooldownText = document.getElementById('cooldownText');
        const fireBtn = document.getElementById('fireBtn');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const eliminatedOverlay = document.getElementById('eliminatedOverlay');
        const restartBtn = document.getElementById('restartBtn');
        const restartBtnOverlay = document.getElementById('restartBtnOverlay');
        const startGameBtn = document.getElementById('startGameBtn');

        // 상태
        let ws = null;
        let playerId = 'player_' + Math.random().toString(36).substr(2, 9);
        let playerName = '';
        let selectedTeam = null;
        let selectedTeamSize = 3;  // 기본 아군 수
        let selectedAiLevel = 1;   // AI 난이도 (1-10)
        let isReady = false;
        let gameStarted = false;
        let sensorActive = false;
        let angle = 45;
        let power = 100;
        let zeroBeta = 45;
        let currentBeta = 0;
        let lives = 3;
        let cooldownEnd = 0;
        const FIRE_COOLDOWN = 2000;

        // WebSocket
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${location.host}/ws`;

        function connect() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                status.textContent = '연결됨';
                status.className = 'connected';
            };

            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                handleMessage(data);
            };

            ws.onclose = () => {
                status.textContent = '연결 끊김';
                status.className = 'disconnected';
                setTimeout(connect, 3000);
            };
        }

        function handleMessage(data) {
            if (data.type === 'player_list') {
                // 내 정보 업데이트
                const myData = data.players[playerId];
                if (myData) {
                    updateMyInfo(myData);
                }

                // 로비에서 인원 표시 및 시작 버튼 상태
                if (!gameStarted) {
                    const playerCount = Object.keys(data.players).length;
                    let readyCount = 0;
                    for (const p of Object.values(data.players)) {
                        if (p.ready) readyCount++;
                    }

                    // 시작 버튼 상태 업데이트
                    const allReady = readyCount === playerCount && playerCount >= 1;
                    startGameBtn.disabled = !allReady;
                    startGameBtn.classList.toggle('show', isReady);  // 준비 상태일 때만 표시

                    if (allReady) {
                        waitingInfo.textContent = `모두 준비 완료! 게임을 시작하세요`;
                        startGameBtn.textContent = `🎮 게임 시작! (${playerCount}명)`;
                    } else {
                        waitingInfo.textContent = `대기 중: ${readyCount}/${playerCount}명 준비`;
                    }
                }
            }

            if (data.type === 'game_start') {
                startGame();
            }

            if (data.type === 'game_restart') {
                resetToLobby();
            }

            if (data.type === 'player_hit' && data.player_id === playerId) {
                lives = data.lives;
                updateLivesDisplay();
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

                if (lives <= 0) {
                    showEliminated();
                }
            }
        }

        function updateMyInfo(data) {
            if (data.team && data.team !== selectedTeam) {
                // 팀 변경됨
            }
        }

        function updateLivesDisplay() {
            const hearts = '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, 3 - lives));
            myLives.textContent = hearts;
            myLives.className = 'lives';
            if (lives === 2) myLives.classList.add('warning');
            if (lives <= 1) myLives.classList.add('danger');
        }

        // 아군 수 선택
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedTeamSize = parseInt(btn.dataset.size);
                if (selectedTeam) registerPlayer();
            };
        });

        // AI 레벨 선택
        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedAiLevel = parseInt(btn.dataset.level);
                if (selectedTeam) registerPlayer();
            };
        });

        // 팀 선택
        redTeamBtn.onclick = () => selectTeam('red');
        blueTeamBtn.onclick = () => selectTeam('blue');

        function selectTeam(team) {
            selectedTeam = team;
            redTeamBtn.classList.toggle('selected', team === 'red');
            blueTeamBtn.classList.toggle('selected', team === 'blue');

            // 준비 버튼 활성화
            readyBtn.disabled = !nameInput.value.trim();

            // 서버에 등록
            registerPlayer();
        }

        nameInput.oninput = () => {
            readyBtn.disabled = !nameInput.value.trim() || !selectedTeam;
        };

        function registerPlayer() {
            playerName = nameInput.value.trim() || 'Player';

            if (ws && ws.readyState === 1 && selectedTeam) {
                ws.send(JSON.stringify({
                    type: 'fortress_multi_controller',
                    player_id: playerId,
                    team: selectedTeam,
                    name: playerName,
                    team_size: selectedTeamSize,
                    ai_level: selectedAiLevel
                }));
            }
        }

        // 게임 재시작 요청
        function requestRestart() {
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({
                    type: 'multi_restart_game'
                }));
            }
            if (navigator.vibrate) navigator.vibrate(100);
        }

        // 재시작 버튼 이벤트
        restartBtn.onclick = requestRestart;
        restartBtnOverlay.onclick = requestRestart;

        // 게임 시작 버튼 (폰에서 직접 시작)
        startGameBtn.onclick = () => {
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({
                    type: 'multi_start_game'
                }));
            }
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        };

        // 준비 버튼
        readyBtn.onclick = () => {
            if (!selectedTeam || !nameInput.value.trim()) return;

            isReady = !isReady;
            readyBtn.textContent = isReady ? '준비 취소' : '준비!';
            readyBtn.classList.toggle('ready', isReady);

            // 서버에 준비 상태 전송
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({
                    type: 'multi_player_ready',
                    player_id: playerId,
                    ready: isReady
                }));
            }

            if (navigator.vibrate) navigator.vibrate(50);
        };

        // 게임 시작
        function startGame() {
            gameStarted = true;
            lobbyScreen.style.display = 'none';
            gameScreen.style.display = 'flex';

            myName.textContent = playerName;
            myInfo.className = 'myInfo ' + selectedTeam;

            lives = 3;
            updateLivesDisplay();

            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 100]);
        }

        // 로비로 리셋
        function resetToLobby() {
            gameStarted = false;
            isReady = false;
            lives = 3;

            gameScreen.style.display = 'none';
            eliminatedOverlay.style.display = 'none';
            lobbyScreen.style.display = 'flex';

            readyBtn.textContent = '준비!';
            readyBtn.classList.remove('ready');
        }

        // 탈락 표시
        function showEliminated() {
            eliminatedOverlay.style.display = 'flex';
            fireBtn.disabled = true;
        }

        // 센서
        sensorBtn.onclick = () => {
            if (sensorActive) return;

            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(r => {
                        if (r === 'granted') enableSensor();
                    })
                    .catch(e => alert('센서 권한 오류'));
            } else {
                enableSensor();
            }
        };

        function enableSensor() {
            sensorActive = true;
            sensorBtn.textContent = '센서 활성화됨 ✓';
            sensorBtn.classList.add('active');
            window.addEventListener('deviceorientation', onOrientation);
        }

        function onOrientation(e) {
            currentBeta = e.beta || 0;

            // 영점 기준 각도 계산
            let diff = currentBeta - zeroBeta;
            angle = 45 + diff;
            angle = Math.max(-15, Math.min(85, Math.round(angle)));

            angleDisplay.textContent = angle + '°';

            // 서버 전송
            if (ws && ws.readyState === 1 && gameStarted) {
                ws.send(JSON.stringify({
                    type: 'angle',
                    player_id: playerId,
                    angle: angle
                }));
            }
        }

        // 영점 설정 (센서 버튼 더블탭)
        let lastSensorTap = 0;
        sensorBtn.addEventListener('touchend', () => {
            const now = Date.now();
            if (now - lastSensorTap < 300 && sensorActive) {
                zeroBeta = currentBeta;
                angle = 45;
                angleDisplay.textContent = '45°';
                if (navigator.vibrate) navigator.vibrate(50);
            }
            lastSensorTap = now;
        });

        // 파워바 드래그
        let draggingPower = false;

        function setPowerFromTouch(clientX) {
            const rect = powerBar.getBoundingClientRect();
            const x = clientX - rect.left;
            power = Math.max(10, Math.min(100, Math.round((x / rect.width) * 100)));

            powerFill.style.width = power + '%';
            powerValue.textContent = power + '%';

            if (ws && ws.readyState === 1 && gameStarted) {
                ws.send(JSON.stringify({
                    type: 'power',
                    player_id: playerId,
                    power: power
                }));
            }
        }

        powerBar.addEventListener('touchstart', (e) => {
            e.preventDefault();
            draggingPower = true;
            setPowerFromTouch(e.touches[0].clientX);
        });
        powerBar.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (draggingPower) setPowerFromTouch(e.touches[0].clientX);
        });
        powerBar.addEventListener('touchend', () => draggingPower = false);

        // 마우스 지원
        powerBar.addEventListener('mousedown', (e) => {
            draggingPower = true;
            setPowerFromTouch(e.clientX);
        });
        document.addEventListener('mousemove', (e) => {
            if (draggingPower) setPowerFromTouch(e.clientX);
        });
        document.addEventListener('mouseup', () => draggingPower = false);

        // 발사
        fireBtn.onclick = () => {
            if (!gameStarted || lives <= 0) return;

            const now = Date.now();
            if (now < cooldownEnd) return;

            // 발사
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({
                    type: 'fire_fortress',
                    player_id: playerId,
                    angle: angle,
                    power: power
                }));
            }

            if (navigator.vibrate) navigator.vibrate(100);

            // 쿨다운 시작
            cooldownEnd = now + FIRE_COOLDOWN;
            updateCooldown();
        };

        // 쿨다운 업데이트
        function updateCooldown() {
            const now = Date.now();
            const remaining = Math.max(0, cooldownEnd - now);

            if (remaining > 0) {
                const percent = (remaining / FIRE_COOLDOWN) * 100;
                cooldownFill.style.width = percent + '%';
                cooldownText.textContent = `재장전 중... ${(remaining / 1000).toFixed(1)}초`;
                fireBtn.disabled = true;
                requestAnimationFrame(updateCooldown);
            } else {
                cooldownFill.style.width = '0%';
                cooldownText.textContent = '발사 준비 완료';
                fireBtn.disabled = false;
            }
        }

        // 이동
        function move(direction) {
            if (!gameStarted || lives <= 0) return;

            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({
                    type: 'move',
                    player_id: playerId,
                    direction: direction
                }));
            }
            if (navigator.vibrate) navigator.vibrate(20);
        }

        // 연속 이동
        let moveInterval = null;

        function startMove(direction) {
            move(direction);
            moveInterval = setInterval(() => move(direction), 80);
        }

        function stopMove() {
            if (moveInterval) {
                clearInterval(moveInterval);
                moveInterval = null;
            }
        }

        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startMove('left'); });
        leftBtn.addEventListener('touchend', stopMove);
        leftBtn.addEventListener('touchcancel', stopMove);
        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startMove('right'); });
        rightBtn.addEventListener('touchend', stopMove);
        rightBtn.addEventListener('touchcancel', stopMove);

        // 마우스 지원
        leftBtn.addEventListener('mousedown', () => startMove('left'));
        leftBtn.addEventListener('mouseup', stopMove);
        leftBtn.addEventListener('mouseleave', stopMove);
        rightBtn.addEventListener('mousedown', () => startMove('right'));
        rightBtn.addEventListener('mouseup', stopMove);
        rightBtn.addEventListener('mouseleave', stopMove);

        // 초기화
        connect();
    </script>
</body>
</html>
